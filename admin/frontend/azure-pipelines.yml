trigger:
  - main

variables:
  # Azure Service Connection Name (User to update)
  azureServiceConnection: "azure-service-connection"
  # Resource Group Name
  resourceGroupName: "CS_Ai365G_RG"
  # ACR Name
  acrName: "acrOrganizationSetupAPI"
  # App Service Name Base
  webAppName: "app-os-frontend"
  # Image Name
  imageRepository: "os-frontend"
  # Dockerfile Path
  dockerfilePath: "$(Build.SourcesDirectory)/Dockerfile"
  # Tag
  tag: "$(Build.BuildId)"

pool:
  vmImage: "ubuntu-latest"

stages:
  - stage: Infrastructure
    displayName: "Infrastructure Provisioning"
    jobs:
      - job: Terraform
        displayName: "Run Terraform"
        steps:
          - task: TerraformInstaller@0
            inputs:
              terraformVersion: "latest"

          - task: TerraformTaskV4@4
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: "$(System.DefaultWorkingDirectory)/infrastructure"
              backendServiceArm: "$(azureServiceConnection)"
              backendAzureRmResourceGroupName: "$(resourceGroupName)"
              backendAzureRmStorageAccountName: "tfstatefrontendai365"
              backendAzureRmContainerName: "tfstate"
              backendAzureRmKey: "frontend.tfstate"

          - task: TerraformTaskV4@4
            displayName: "Terraform Apply"
            inputs:
              provider: "azurerm"
              command: "apply"
              workingDirectory: "$(System.DefaultWorkingDirectory)/infrastructure"
              commandOptions: "-auto-approve"
              environmentServiceNameAzureRM: "$(azureServiceConnection)"

  - stage: Build
    displayName: "Build and Push"
    dependsOn: Infrastructure
    jobs:
      - job: Build
        displayName: "Build"
        steps:
          - script: |
              curl -fsSL https://bun.sh/install | bash
              echo "##vso[task.prependpath]$HOME/.bun/bin"
            displayName: "Install Bun"
            workingDirectory: "$(Build.SourcesDirectory)"

          - script: |
              bun install
            displayName: "Install Dependencies"
            workingDirectory: "$(Build.SourcesDirectory)"

          - script: |
              bun run lint
            displayName: "Run Biome Lint and Format (Auto-Fix)"
            workingDirectory: "$(Build.SourcesDirectory)"

          - task: AzureCLI@2
            displayName: "Build and Push to ACR"
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                # Robust login using access token
                TOKEN=$(az acr login --name $(acrName) --expose-token --output tsv --query accessToken)
                docker login $(acrName).azurecr.io --username 00000000-0000-0000-0000-000000000000 --password $TOKEN

                # Build and Push
                docker build -t $(acrName).azurecr.io/$(imageRepository):$(tag) -t $(acrName).azurecr.io/$(imageRepository):latest -f $(dockerfilePath) .
                docker push $(acrName).azurecr.io/$(imageRepository):$(tag)
                docker push $(acrName).azurecr.io/$(imageRepository):latest

  - stage: DeployStaging
    displayName: "Deploy to Staging"
    dependsOn: Build
    jobs:
      - deployment: DeployStaging
        displayName: "Deploy Staging"
        environment: "Staging"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: "Deploy to App Service Staging"
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    appName: "$(webAppName)-staging"
                    containers: "$(acrName).azurecr.io/$(imageRepository):$(tag)"

  - stage: DeployProduction
    displayName: "Deploy to Production"
    dependsOn: DeployStaging
    condition: succeeded()
    jobs:
      - job: WaitForApproval
        displayName: "Wait for Approval"
        pool: server
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: ""
              instructions: "Please validate the staging deployment before approving production deployment."
              onTimeout: "reject"

      - deployment: DeployProduction
        displayName: "Deploy Production"
        dependsOn: WaitForApproval
        environment: "Production"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: "Deploy to App Service Production"
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    appName: "$(webAppName)"
                    containers: "$(acrName).azurecr.io/$(imageRepository):$(tag)"
