table: "FCT_NPS"
description: "NPS(고객추천지수) 설문 결과 팩트 테이블."
database: "KPI_W"
schema: "ktws"
grain: "NPS 시퀀스(nps_seq) 단위의 설문 응답."
columns:
  -
    name: "sc_key"
    type: "varchar(100)"
    description: "SC키. DIM_MNG_USER와 조인해 담당 SC/딜러/지점 정보를 조회할 때 사용한다."
  -
    name: "nps_seq"
    type: "decimal(18,0)"
    description: "NPS 시퀀스. 이 테이블의 기준 키."
  -
    name: "biz_area"
    type: "varchar(100)"
    description: "사업 부문. 조회 결과의 속성, 그룹핑, 필터 조건으로 사용할 수 있다."
  -
    name: "ref_key"
    type: "varchar(100)"
    description: "연관키(계약/전시장 방문 등 원본 업무 건 식별자). 식별자 또는 코드 조건으로 사용한다."
  -
    name: "promoter_score"
    type: "decimal(18,0)"
    description: "NPS 점수. 집계, 합계, 평균, 비교 계산에 사용할 수 있다."
  -
    name: "cust_comment"
    type: "varchar(5000)"
    description: "고객 코멘트."
  -
    name: "reply_date"
    type: "date"
    description: "고객 응답날짜. DIM_CALENDAR_KTWS.Date와 조인할 때 사용한다."
  -
    name: "BRAND"
    type: "varchar(100)"
    description: "브랜드DB구분. 식별자 또는 코드 조건으로 사용한다."
  -
    name: "ETL_TIMESTAMP"
    type: "datetime2(6)"
    description: "ETL 타임스탬프. 업무일자가 아니라 데이터 적재 시각을 확인할 때만 사용한다."
semantics:
  role:
    - "NPS_FACT"
    - "CUSTOMER_SATISFACTION"
  keys:
    primary:
      - "nps_seq"
    foreign:
      -
        column: "sc_key"
        references:
          schema: "ktws"
          table: "DIM_MNG_USER"
          column: "sc_key"
        description: "담당 SC/딜러/지점 정보를 조회할 때 사용한다."
      -
        column: "reply_date"
        references:
          schema: "ktws"
          table: "DIM_CALENDAR_KTWS"
          column: "Date"
        description: "날짜 차원으로 그룹핑할 때 사용한다."
dimensions:
  - "sc_key"
  - "nps_seq"
  - "biz_area"
  - "ref_key"
  - "cust_comment"
  - "reply_date"
  - "BRAND"
features:
  -
    name: "sc_key"
    synonyms:
      - "SC키"
  -
    name: "nps_seq"
    synonyms:
      - "nps 시퀀스"
  -
    name: "biz_area"
    synonyms:
      - "사업 부문"
  -
    name: "ref_key"
    synonyms:
      - "연관키"
  -
    name: "promoter_score"
    synonyms:
      - "nps점수"
      - "고객추천지수"
  -
    name: "cust_comment"
    synonyms:
      - "고객코멘트"
  -
    name: "reply_date"
    synonyms:
      - "답변날짜"
  -
    name: "BRAND"
    synonyms:
      - "브랜드DB구분"
measures:
  -
    name: "promoter_score"
    aggregation: "avg"
    description: "NPS 점수"
display:
  default_columns:
    - "nps_seq"
    - "sc_key"
    - "biz_area"
    - "promoter_score"
    - "reply_date"
