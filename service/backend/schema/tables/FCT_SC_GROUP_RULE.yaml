table: "FCT_SC_GROUP_RULE"
description: "SC 등급 분류 규칙 테이블. 월평균 출고대수·누적취소율 같은 지표를 구간으로 나눠 SC를 A/B/C 등급으로 분류하는 기준을 담는다."
database: "KPI_W"
schema: "ktws"
grain: "딜러(DEALER_KEY) × 지표유형(METRIC_TYPE) × 등급(GRP_NAME) 단위의 분류 구간 정의."
columns:
  -
    name: "BRAND"
    type: "varchar(50)"
    nullable: false
    description: "브랜드. 등급 기준이 브랜드마다 다를 수 있어 규칙의 구성 키에 포함된다."
  -
    name: "DEALER_KEY"
    type: "varchar(50)"
    nullable: false
    description: "딜러키. DIM_MNG_DEALER와 조인한다. 등급 기준은 딜러별로 따로 설정된다."
  -
    name: "METRIC_TYPE"
    type: "varchar(50)"
    nullable: false
    description: "등급을 매길 지표의 종류. 어느 값을 구간에 대입할지 결정한다."
  -
    name: "CALC_TYPE"
    type: "varchar(20)"
    nullable: false
    description: "계산 방식. 지표를 평균으로 볼지 비율로 볼지 등을 구분한다."
  -
    name: "OBS_PERIOD"
    type: "int"
    nullable: false
    description: "관측 기간 길이. OBS_PERIOD_UNIT과 함께 '최근 N개월' 같은 창을 정한다."
  -
    name: "OBS_PERIOD_UNIT"
    type: "varchar(10)"
    nullable: false
    description: "관측 기간 단위(월/일 등). OBS_PERIOD와 짝을 이룬다."
  -
    name: "GRP_CATEGORY"
    type: "varchar(50)"
    nullable: false
    description: "등급 분류 기준 이름. sc_delivery_status 리포트의 '평가기준' 컬럼으로 나오며 '누적 취소율'/'출고평균대수' 같은 값을 갖는다."
  -
    name: "GRP_NAME"
    type: "varchar(10)"
    nullable: false
    description: "등급 이름(A/B/C 등). sc_delivery_status의 '그룹분류' 컬럼과 A/B/C 집계 컬럼의 근거다."
  -
    name: "RANGE_FROM"
    type: "decimal(10,4)"
    nullable: true
    description: "구간 하한. NULL이면 하한 없음(최저 등급의 열린 구간)."
  -
    name: "RANGE_TO"
    type: "decimal(10,4)"
    nullable: true
    description: "구간 상한. NULL이면 상한 없음(최고 등급의 열린 구간)."
  -
    name: "NOTE"
    type: "varchar(255)"
    nullable: true
    description: "규칙에 대한 비고. 집계에는 쓰지 않는다."
  -
    name: "ETL_TIMESTAMP"
    type: "datetime2"
    nullable: false
    description: "적재 시각. 데이터 신선도 확인용이며 업무 지표로는 쓰지 않는다."
