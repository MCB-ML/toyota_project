table: "FCT_MNG_CUST_LIST"
description: "SC별 담당 고객 목록 팩트 테이블."
database: "KPI_W"
schema: "ktws"
grain: "고객시퀀스(cust_seq) 단위의 담당 고객 매핑."
columns:
  -
    name: "cust_seq"
    type: "varchar(100)"
    description: "고객시퀀스1. 이 테이블의 기준 키."
  -
    name: "real_cust_seq"
    type: "varchar(100)"
    description: "고객시퀀스2(실제 고객번호). 식별자 또는 코드 조건으로 사용한다."
  -
    name: "mng_sc_key"
    type: "varchar(100)"
    description: "담당 SC키. DIM_MNG_USER와 조인해 담당 SC/딜러/지점 정보를 조회할 때 사용한다."
  -
    name: "BRAND"
    type: "varchar(100)"
    description: "브랜드DB구분. 식별자 또는 코드 조건으로 사용한다."
  -
    name: "ETL_TIMESTAMP"
    type: "datetime2(6)"
    description: "ETL 타임스탬프. 업무일자가 아니라 데이터 적재 시각을 확인할 때만 사용한다."
semantics:
  role:
    - "MANAGED_CUSTOMER_LIST"
  keys:
    primary:
      - "cust_seq"
    foreign:
      -
        column: "mng_sc_key"
        references:
          schema: "ktws"
          table: "DIM_MNG_USER"
          column: "sc_key"
        description: "담당 SC/딜러/지점 정보를 조회할 때 사용한다."
dimensions:
  - "cust_seq"
  - "real_cust_seq"
  - "mng_sc_key"
  - "BRAND"
features:
  -
    name: "cust_seq"
    synonyms:
      - "고객시퀀스1"
  -
    name: "real_cust_seq"
    synonyms:
      - "고객시퀀스2"
  -
    name: "mng_sc_key"
    synonyms:
      - "담당 SC키"
  -
    name: "BRAND"
    synonyms:
      - "브랜드DB구분"
display:
  default_columns:
    - "cust_seq"
    - "real_cust_seq"
    - "mng_sc_key"
