table: "FCT_CONTRACT_KTWS"
description: "차량 계약 팩트 테이블. 계약 건수/취소/출고 관련 KPI의 기준 테이블."
database: "KPI_W"
schema: "ktws"
grain: "계약키(contract_no) 단위의 계약 실적."
columns:
  -
    name: "cnt"
    type: "int"
    description: "계약카운트. 계약 건수를 집계할 때 SUM한다."
  -
    name: "lead_key"
    type: "varchar(200)"
    description: "영업기회키. 식별자 또는 코드 조건으로 사용한다."
  -
    name: "mng_sc_key"
    type: "varchar(200)"
    description: "담당SC키(출고 시점 기준). 식별자 또는 코드 조건으로 사용한다."
  -
    name: "tp_key"
    type: "varchar(100)"
    description: "활동유형키. DIM_CRM_ACT_TYPE과 조인해 이 계약을 만든 활동유형의 상위카테고리를 조회할 때 사용한다."
  -
    name: "potential"
    type: "varchar(200)"
    description: "관심도. 조회 결과의 속성, 그룹핑, 필터 조건으로 사용할 수 있다."
  -
    name: "lead_reg_dt"
    type: "date"
    description: "영업기회등록일자. 기간 조건, 정렬, 최근 데이터 조회에 사용한다."
  -
    name: "cn_sc_key"
    type: "varchar(200)"
    description: "SC연결키(계약 담당). DIM_MNG_USER와 조인해 담당 SC/딜러/지점 정보를 조회할 때 사용한다."
  -
    name: "dlr_contract_no"
    type: "varchar(200)"
    description: "딜러계약번호. 식별자 또는 코드 조건으로 사용한다."
  -
    name: "contract_no"
    type: "int"
    description: "계약키. 이 테이블의 기준 키."
  -
    name: "contract_dt"
    type: "date"
    description: "계약일자. DIM_CALENDAR_KTWS.Date와 조인하며, 계약 건수의 기간 필터 기준이다."
  -
    name: "cn_vehic_key"
    type: "varchar(200)"
    description: "차량유형키. DIM_VEHIC_SPEC과 조인해 모델/차종/SFX 정보를 조회할 때 사용한다."
  -
    name: "pay_type"
    type: "varchar(100)"
    description: "지불유형. 조회 결과의 속성, 그룹핑, 필터 조건으로 사용할 수 있다."
  -
    name: "own_pay_flag"
    type: "varchar(100)"
    description: "자사금융여부. 여부 조건으로 필터링할 때 사용한다."
  -
    name: "sales_tp_key"
    type: "varchar(100)"
    description: "판매유형키. DIM_REPURC_SALES_TYPE과 조인해 재구매/판매유형 분류를 조회할 때 사용한다."
  -
    name: "pma_yn"
    type: "varchar(100)"
    description: "PMA in/out 여부. DIM_PMA_ORDER.pma_cd와 조인할 때 사용한다."
  -
    name: "prime_act_seq"
    type: "varchar(100)"
    description: "최초 활동 시퀀스. FCT_ACTIVITY_v2.act_pk와 연결할 때 사용한다."
  -
    name: "prime_act_fr_dt"
    type: "date"
    description: "최초 활동 일자. 기간 조건, 정렬, 최근 데이터 조회에 사용한다."
  -
    name: "cust_nm"
    type: "varchar(100)"
    description: "고객명. 조회 결과의 속성, 그룹핑, 필터 조건으로 사용할 수 있다."
  -
    name: "cancel_dt"
    type: "date"
    description: "취소일자. 기간 조건, 정렬, 최근 데이터 조회에 사용한다."
  -
    name: "delivery_plan_dt"
    type: "date"
    description: "출고예정일자. 기간 조건, 정렬, 최근 데이터 조회에 사용한다."
  -
    name: "last_retail_sales_dt"
    type: "date"
    description: "출고일자(실제). 기간 조건, 정렬, 최근 데이터 조회에 사용한다."
  -
    name: "sales_in_30days"
    type: "varchar(1)"
    description: "당일 기준 30일 이내 출고 여부. 여부 조건으로 필터링할 때 사용한다."
  -
    name: "lead_time"
    type: "int"
    description: "최초 활동 일자부터 계약까지 걸린 기간(일). 집계, 합계, 평균, 비교 계산에 사용할 수 있다."
  -
    name: "BRAND"
    type: "varchar(100)"
    description: "브랜드DB구분. 식별자 또는 코드 조건으로 사용한다."
  -
    name: "ETL_TIMESTAMP"
    type: "datetime2(6)"
    description: "ETL 타임스탬프. 업무일자가 아니라 데이터 적재 시각을 확인할 때만 사용한다."
semantics:
  role:
    - "CONTRACT_FACT"
    - "SALES_CONTRACT"
  keys:
    primary:
      - "contract_no"
    foreign:
      -
        column: "cn_sc_key"
        references:
          schema: "ktws"
          table: "DIM_MNG_USER"
          column: "sc_key"
        description: "담당 SC/딜러/지점 정보를 조회할 때 사용한다."
      -
        column: "cn_vehic_key"
        references:
          schema: "ktws"
          table: "DIM_VEHIC_SPEC"
          column: "spec_key"
        description: "모델/차종/SFX 정보를 조회할 때 사용한다."
      -
        column: "contract_dt"
        references:
          schema: "ktws"
          table: "DIM_CALENDAR_KTWS"
          column: "Date"
        description: "날짜 차원(연/월/분기/주차 등)으로 그룹핑할 때 사용한다."
      -
        column: "pma_yn"
        references:
          schema: "ktws"
          table: "DIM_PMA_ORDER"
          column: "pma_cd"
        description: "PMA in/out 분류명을 조회할 때 사용한다."
      -
        column: "sales_tp_key"
        references:
          schema: "ktws"
          table: "DIM_REPURC_SALES_TYPE"
          column: "sales_tp_key"
        description: "재구매/판매유형 분류를 조회할 때 사용한다."
      -
        column: "tp_key"
        references:
          schema: "ktws"
          table: "DIM_CRM_ACT_TYPE"
          column: "tp_key"
        description: "이 계약을 만든 활동유형의 상위카테고리를 조회할 때 사용한다."
filters:
  -
    column: "own_pay_flag"
    description: "자사금융여부"
  -
    column: "sales_in_30days"
    description: "당일 기준 30일 이내 출고 여부"
dimensions:
  - "lead_key"
  - "mng_sc_key"
  - "tp_key"
  - "potential"
  - "lead_reg_dt"
  - "cn_sc_key"
