table: "FCT_CRM_TARGET_D"
description: "일 단위 CRM 목표(타겟) 팩트 테이블."
database: "KPI_W"
schema: "ktws"
grain: "일구분키(day_seq) 단위의 SC별/활동유형별 일간 CRM 목표."
columns:
  -
    name: "mon_key"
    type: "varchar(100)"
    description: "월구분키. FCT_CRM_TARGET_M.mon_key와 연결할 때 사용한다."
  -
    name: "day_seq"
    type: "varchar(100)"
    description: "일구분키. 이 테이블의 기준 키."
  -
    name: "sc_key"
    type: "varchar(100)"
    description: "SC연결키. DIM_MNG_USER와 조인해 담당 SC/딜러/지점 정보를 조회할 때 사용한다."
  -
    name: "type_cd"
    type: "varchar(100)"
    description: "활동유형코드. DIM_CRM_ACT_TYPE.tp_key와 조인해 활동유형의 상위카테고리를 조회할 때 사용한다."
  -
    name: "daily_dt"
    type: "date"
    description: "타겟할당일자. DIM_CALENDAR_KTWS.Date와 조인할 때 사용한다."
  -
    name: "target_cnt"
    type: "int"
    description: "목표건수. 집계, 합계, 평균, 비교 계산에 사용할 수 있다."
  -
    name: "BRAND"
    type: "varchar(20)"
    description: "브랜드DB구분. 식별자 또는 코드 조건으로 사용한다."
  -
    name: "ETL_TIMESTAMP"
    type: "datetime2(6)"
    description: "ETL 타임스탬프. 업무일자가 아니라 데이터 적재 시각을 확인할 때만 사용한다."
semantics:
  role:
    - "CRM_TARGET_FACT"
    - "DAILY_TARGET"
  keys:
    primary:
      - "day_seq"
    foreign:
      -
        column: "sc_key"
        references:
          schema: "ktws"
          table: "DIM_MNG_USER"
          column: "sc_key"
        description: "담당 SC/딜러/지점 정보를 조회할 때 사용한다."
      -
        column: "daily_dt"
        references:
          schema: "ktws"
          table: "DIM_CALENDAR_KTWS"
          column: "Date"
        description: "날짜 차원으로 그룹핑할 때 사용한다."
      -
        column: "type_cd"
        references:
          schema: "ktws"
          table: "DIM_CRM_ACT_TYPE"
          column: "tp_key"
        description: "목표 활동유형의 상위카테고리를 조회할 때 사용한다."
dimensions:
  - "mon_key"
  - "day_seq"
  - "sc_key"
  - "type_cd"
  - "daily_dt"
  - "BRAND"
features:
  -
    name: "mon_key"
    synonyms:
      - "월구분키"
  -
    name: "day_seq"
    synonyms:
      - "일구분키"
  -
    name: "sc_key"
    synonyms:
      - "SC연결키"
  -
    name: "type_cd"
    synonyms:
      - "활동유형코드"
  -
    name: "daily_dt"
    synonyms:
      - "타겟할당일자"
  -
    name: "target_cnt"
    synonyms:
      - "목표건수"
  -
    name: "BRAND"
    synonyms:
      - "브랜드DB구분"
measures:
  -
    name: "target_cnt"
    aggregation: "sum"
    description: "목표건수"
display:
  default_columns:
    - "day_seq"
    - "sc_key"
    - "daily_dt"
    - "type_cd"
    - "target_cnt"
