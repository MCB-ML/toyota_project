# 2026-08-04 leo: source_dependencies는 SQL 파싱 대신 base_table별 watermark source를 선언한다.
# Contract Metrics
# 근거: sheet 2-1 gold_2_1_042~047 (실적/취소/타겟/달성률 통합쿼리), 1-1 gold_1_1_021~024

source_dependencies:
  FCT_CONTRACT_KTWS: {source_id: contract, table: FCT_CONTRACT_KTWS, watermark_column: ETL_TIMESTAMP}
  FCT_CRM_TARGET_M: {source_id: contract_target_monthly, table: FCT_CRM_TARGET_M, watermark_column: ETL_TIMESTAMP}

metrics:
  - id: contract_mtd_actual
    name_ko: 당월 계약 실적 (전체실적, 취소 제외)
    description: >
      cancel_dt가 NULL인 계약 건수 합 — 취소 건은 제외한 '유효 계약' 전체실적(활동/Lead
      경유 여부 무관). 2026-07: "계약건수"를 단독으로 물었을 때의 기본값은 이 지표가 아니라
      contract_mtd_activity_actual(퍼널 전환 기준)로 확정됨 — 사용자가 "전체실적"/"퍼널
      조건 없이"처럼 명시적으로 요청했을 때만 이 지표를 쓴다.
    metric_type: base_metric
    fact_entity: Contract
    base_table: FCT_CONTRACT_KTWS
    # 2026-08-05 leo: 검증된 월별 계약 쿼리와 같은 유효 사용자 관계를 강제하되, 딜러명 정책은 해당 쿼리의 독립 규칙을 유지한다.
    required_inner_join_tables: [DIM_MNG_USER, DIM_MNG_DEALER]
    apply_default_dealer_scope: false
    expression: "SUM(CASE WHEN FCT_CONTRACT_KTWS.cancel_dt IS NULL THEN FCT_CONTRACT_KTWS.cnt ELSE 0 END)"
    aggregation: sum
    grain: [sales_consultant, month]
    time_dimension: FCT_CONTRACT_KTWS.contract_dt
    default_time_grain: month
    supported_time_grains: [month, year]
    required_filters: []
    exclusion_rules: [sc_scope_default]
    null_handling: "매칭 없으면 0 (ISNULL 처리됨)"
    dimensions: [brand, dealer, showroom, department, sales_consultant, active_status, vehicle_model, vehicle_variant, vehicle_year, grade_sfx, time_month, time_day]
    additive_behavior: {across_time: additive, across_organization: additive}
    dependencies: []
    source_evidence: [{sql_id: gold_2_1_046, note: "CN.ac_val"}, {note: "Power BI 라이브 측정값 '3. cntrct_mtd_(ac)' DAX 실측 결과 정확히 일치 확인(2026-07-24)"}, {note: "2026-07-27: time_month breakdown은 joins.yaml의 contract_to_calendar 엣지 추가로 활성화"}]
    confidence: high

  - id: contract_mtd_activity_actual
    name_ko: 계약건수 (당월활동실적, 퍼널 전환 기준)
    certified_source:
      report: funnel_full_structure
      column: 계약건수(당월활동실적)
      status: verified_match
      evidence: >
        2026-04 기준 이 지표 = 1,533, 검증된 1-1 리포트 = 1,534, Power BI 웹 = 1,536.
        차이 −1~−3은 그동안 반복 관측된 조회 시점 변동 범위 안이다. (2026-07-31 대조)
      history: >
        2026-07-29에 "Power BI 정렬"이라며 자격활동 EXISTS의 SC 상관·활동유형 상관을
        제거해 +52 과다(1,586)가 된 적이 있다. 그때 기준으로 삼은 스크린샷에 브랜드
        필터가 빠져 있었던 게 원인이다. 올바른 기준(재직 + 브랜드 TOYOTA·LEXUS)으로
        재측정해 두 상관 조건을 복원했다:
          상관 없음 1,586 → 활동유형 상관 1,539 → SC 상관까지 1,533
        활동그룹·부재중은 계약 쪽에 걸지 않는 것이 맞다(걸면 과소 집계).
        근거는 1-1 GOLD의 contract_activity_count CTE — lead_activity_pool과
        valid_type을 SC·활동유형으로 상관 조인한다.
    description: >
      "계약건수"를 단독으로 물었을 때의 기본 지표(2026-07 business owner 확정). "관계형성/
      기회창출 활동이 있고(부재중 제외), 해당 월에 등록되어 유효 상태(열려있거나 이미 매출
      전환)인 Lead에서 발생한, 취소되지 않은 계약"만 센다. lead_mtd_actual의 자격 리드 풀을
      그대로 재사용해 FCT_CONTRACT_KTWS로 한 단계 더 조인한다. contract_mtd_actual(전체실적,
      활동/Lead 경유 여부 무관)과는 서로 다른 모집단이다 — 사용자가 "전체실적"처럼 퍼널
      조건을 명시적으로 배제했을 때만 그쪽을 쓴다.
    metric_type: base_metric
    fact_entity: Contract
    base_table: FCT_CONTRACT_KTWS
    expression: unresolved  # controlled_analysis 경로가 대신 처리
    not_directly_compilable: true
    not_directly_compilable_reason: >
      lead_mtd_actual과 동일한 이유 — "자격 있는 활동을 가진 Lead에서 발생한 계약"이라는
      조건은 FCT_ACTIVITY_v2/FCT_LEAD에 대한 상관 서브쿼리로만 정확히 표현되고,
      compileSingleMetricQuery(flat JOIN 전용)로는 낼 수 없다.
    controlled_analysis: true
    controlled_analysis_note: >
      2026-07-24: 처음엔 "계약건수"를 물었을 때 contract_mtd_actual(전체실적)로 답하는 게
      온톨로지상 기본값이라고 판단했으나, 이후 평가표 재검토에서 business owner가 이
      지표(퍼널 전환 기준)를 "계약건수" 단독 질문의 기본값으로 확정함 — agenticBiPipeline.js의
      프롬프트 가이드를 이에 맞게 반대로 뒤집었다(2026-07-27). 참고로 제시된 원본 참조
      쿼리는 filtered_users CTE에서 facade_sc_yn/name을 순수 NOT IN으로 걸러 NULL 행이
      조용히 빠지는 버그가 있었다 — agenticBiPipeline.js의 실제 구현은
      br_exclude_front_sc/br_exclude_staff_names(IS NULL OR <> 패턴)를 그대로 재사용해
      이 버그를 피한다. cancel_dt IS NULL(br_contract_cancel_exclusion)도 참조 쿼리에는
      빠져 있었는데 온톨로지 계약 상태 기준과 맞추기 위해 추가했다.
    aggregation: sum
    grain: [sales_consultant, month]
    time_dimension: FCT_CONTRACT_KTWS.contract_dt
    default_time_grain: month
    supported_time_grains: [month]
    required_filters: [br_contract_cancel_exclusion, br_qualified_lead_def, br_tp_grp_scope, br_act_result_exclusion]
    exclusion_rules: [sc_scope_default]
    null_handling: "매칭 없으면 0"
    dimensions: [brand, dealer, showroom, department, sales_consultant, active_status, time_month, time_day]
    additive_behavior: {across_time: additive, across_organization: additive}
    dependencies: [lead_mtd_actual]
    source_evidence: [{note: "사용자 제시 참조 쿼리(2026-07-24) — activity_leads/lead_pool CTE 구조, cancel_dt 조건과 NULL 처리는 온톨로지 규칙에 맞게 보정"}, {note: "2026-07-27: time_month breakdown 추가 — compileContractMtdActivityActual에 DIM_CALENDAR_KTWS 조인을 직접 추가해 활성화(controlled_analysis 컴파일러는 joins.yaml 자동 탐색을 안 씀)"}]
    confidence: high
    status: confirmed_default_for_bare_contract_count

  - id: contract_mtd_testdrive_actual
    name_ko: 계약건수 (시승 리드 기준)
    certified_source:
      report: funnel_full_structure
      column: 시승에서 계약으로 당월활동실적
      status: verified_match
      evidence: >
        2026-04 기준 전용 컴파일러(compileContractMtdTestdriveActual) = 375 이고
        1-1 리포트의 '시승에서 계약으로 당월활동실적'도 375 로 일치한다(2026-07-31 대조).
      note: >
        testdrive_mtd_actual과 마찬가지로 상관 조건 없이도 값이 맞는다.
        같은 계열인 contract_mtd_activity_actual은 상관이 필요했으므로 지표마다 다르다.
    description: >
      contract_mtd_activity_actual과 같은 퍼널 구조(자격 활동 있는 리드 -> 당월 등록·
      유효 상태 리드)에 "시승 신청 리드(FCT_LEAD.td_yn='Y')" 조건이 하나 더 붙는다 —
      testdrive_to_contract_conversion_rate(시승→계약 전환율)의 분자 전용 지표. "활동유형이
      시승인 계약"이 아니라 "시승을 신청한 리드에서 발생한 계약"이라는 점에 주의 —
      activity_type=시승 필터를 이 지표나 contract_mtd_activity_actual에 직접 붙이지 말 것
      (계약 fact에는 활동유형 컬럼이 없어 조인 자체가 안 됨).
    metric_type: base_metric
    fact_entity: Contract
    base_table: FCT_CONTRACT_KTWS
    expression: unresolved  # controlled_analysis 경로가 대신 처리
    not_directly_compilable: true
    not_directly_compilable_reason: "contract_mtd_activity_actual과 동일 — 상관 서브쿼리 3단계 퍼널이라 flat JOIN 컴파일러로 표현 불가."
    controlled_analysis: true
    # 2026-08-03 leo: 기존에는 시승 리드 기준 계약을 별도 컴파일러로만 계산해 퍼널 표와 정의가 갈릴 수 있었다. 인증 GOLD CTE를 우선 사용하고 지원하지 않는 모양에서만 기존 컴파일러로 폴백한다.
    controlled_analysis_note: >
      인증 퍼널 GOLD의 overall_contract_td_activity_count CTE를 우선 파생해 실행한다.
      GOLD로 표현할 수 없는 시간/차원 요청에만 compileContractMtdTestdriveActual의 기존
      제어 컴파일러로 폴백한다. activity_type=시승 필터를 일반 계약 지표에 붙이는 방식은
      여전히 금지한다.
    aggregation: sum
    grain: [sales_consultant, month]
    time_dimension: FCT_CONTRACT_KTWS.contract_dt
    default_time_grain: month
    supported_time_grains: [month]
    required_filters: [br_contract_cancel_exclusion, br_qualified_lead_def, br_tp_grp_scope, br_act_result_exclusion]
    exclusion_rules: [sc_scope_default]
    null_handling: "매칭 없으면 0"
    dimensions: [brand, dealer, showroom, department, sales_consultant, active_status]
    additive_behavior: {across_time: additive, across_organization: additive}
    dependencies: [testdrive_mtd_actual]
    source_evidence: [{note: "사용자 제시 참조 쿼리(2026-07) — activity_leads/lead_pool(td_yn='Y' 추가) CTE 구조, cancel_dt 조건은 온톨로지 규칙에 맞게 보정"}]
    confidence: medium
    status: needs_business_owner_review

  # 2026-08-03 leo: 기존에는 퍼널의 계약 전체실적·목표·진행률 원자값이 일반 계약 메트릭과 섞여 모집단이 달라질 수 있었다. 인증 GOLD CTE에 대응하는 독립 메트릭을 등록해 퍼널 정의를 그대로 보존한다.
  - id: contract_mtd_testdrive_total_actual
    name_ko: 시승에서 계약 (당월전체실적)
    description: "퍼널 표의 '시승에서 계약으로 당월전체실적' - 당월 전체 시승완료 리드에서 발생한 계약 cnt 합계"
    certified_source:
      report: funnel_full_structure
      column: 시승에서 계약으로 당월전체실적
      status: verified_source
    metric_type: base_metric
    fact_entity: Contract
    base_table: FCT_CONTRACT_KTWS
    expression: unresolved
    not_directly_compilable: true
    not_directly_compilable_reason: "전체 시승완료 리드 집합과 계약을 연결하는 인증 퍼널 CTE가 필요함."
    controlled_analysis: true
    aggregation: sum
    grain: [sales_consultant, month]
    supported_time_grains: [month]
    dimensions: [brand, dealer, showroom, department, sales_consultant]
    dependencies: [testdrive_mtd_total_lead_actual]
    confidence: high

  - id: contract_mtd_total_actual_funnel
    name_ko: 당월 계약 실적 (퍼널 전체실적)
    description: "퍼널 표의 '계약건수(당월전체실적)' - 활동 경유 여부와 무관한 퍼널 기준 계약 cnt 합계"
    certified_source:
      report: funnel_full_structure
      column: 계약건수(당월전체실적)
      status: verified_source
    metric_type: base_metric
    fact_entity: Contract
    base_table: FCT_CONTRACT_KTWS
    expression: unresolved
    not_directly_compilable: true
    not_directly_compilable_reason: "퍼널의 유형 및 사용자 스코프를 인증 GOLD와 동일하게 유지해야 함."
    controlled_analysis: true
    aggregation: sum
    grain: [sales_consultant, month]
    supported_time_grains: [month]
    dimensions: [brand, dealer, showroom, department, sales_consultant]
    dependencies: []
    confidence: high

  - id: contract_mtd_target_funnel
    name_ko: 당월 계약 목표 (퍼널 기준)
    description: "퍼널 표의 '계약 당월 목표' - 계약 유형의 FCT_CRM_TARGET_M 목표 합계"
    certified_source:
      report: funnel_full_structure
      column: 계약 당월 목표
      status: verified_source
    metric_type: target_metric
    fact_entity: Contract
    base_table: FCT_CRM_TARGET_M
    expression: unresolved
    not_directly_compilable: true
    not_directly_compilable_reason: "계약 유형 한정과 사용자 스코프를 포함한 인증 퍼널 CTE를 사용함."
    controlled_analysis: true
    aggregation: sum
    grain: [sales_consultant, month]
    supported_time_grains: [month]
    dimensions: [brand, dealer, showroom, department, sales_consultant]
    dependencies: []
    confidence: high

  - id: contract_mtd_progress_actual_funnel
    name_ko: 당월 계약 진행률 분자 (퍼널 기준)
    description: >
      PBIX '3. cntrct_funnel_(mtd)_coalesce'에 대응하는 계약 진행률 분자. 자격 활동을
      보유한 리드 중 월말 이후에도 열려 있는 리드(close_dt > 월말 또는 NULL)에서 발생한
      당월 계약을 합산하고, 결과가 없으면 0으로 처리한다. 일반 계약 실적과 모집단이 다르다.
    certified_source:
      report: funnel_full_structure
      column: 계약건수(당월활동실적)
      status: verified_source
    metric_type: base_metric
    fact_entity: Contract
    base_table: FCT_CONTRACT_KTWS
    expression: unresolved
    not_directly_compilable: true
    not_directly_compilable_reason: "계약 진행률 전용 리드 풀은 일반 계약 실적의 리드 풀과 종료 상태 조건이 다름."
    controlled_analysis: true
    aggregation: sum
    grain: [sales_consultant, month]
    supported_time_grains: [month]
    dimensions: [brand, dealer, showroom, department, sales_consultant]
    dependencies: []
    # 2026-08-04 leo: 기존 설명은 계약 진행률 분자의 원본 PBIX 측정값을 밝히지 않아 일반 계약 실적과 혼용될 여지가 있었다. 인증 GOLD CTE와 cntrct_funnel_(mtd)_coalesce의 대응을 명시한다.
    source_evidence: [{measure: "3. cntrct_funnel_(mtd)_coalesce", cte: overall_contract_progress_count}]
    confidence: high

  - id: contract_progress_rate_mtd_funnel
    name_ko: 당월 계약 진행률 (퍼널 기준)
    description: "퍼널 표의 계약 진행률. 전용 진행률 분자 ÷ 퍼널 계약 목표로 계산한다."
    metric_type: progress_metric
    numerator_metric: contract_mtd_progress_actual_funnel
    denominator_metric: contract_mtd_target_funnel
    expression: "safe_divide(numerator, denominator, zero_denominator=0.0)"
    zero_denominator_result: 0.0
    format: percentage
    grain: [sales_consultant, month]
    dimensions: [brand, dealer, showroom, department, sales_consultant]
    dependencies: [contract_mtd_progress_actual_funnel, contract_mtd_target_funnel]
    source_evidence: [{report: funnel_full_structure, column: 계약 진행률}]
    confidence: high

  - id: contract_ytd_actual
    name_ko: 연누적 계약 실적
    description: >
      contract_mtd_actual과 유효 계약 개념은 같지만, 취소 예외 규칙이 더 관대하다
      (br_contract_cancel_exclusion_ytd 참고 — "리포트 기준월 말일 이후 취소"는 그래도
      실적으로 인정). GOLD SQL 문서(gold_2_1_046)에는 이 유예 규칙이 없었는데, 실제 라이브
      BI 측정값(cntrct_ytd_(ac)) DAX를 직접 조회해서 발견한 차이 — 이 필드는 이제 GOLD SQL이
      아니라 그 실측 DAX를 근거로 한다.
    metric_type: base_metric
    fact_entity: Contract
    base_table: FCT_CONTRACT_KTWS
    # 2026-08-05 leo: 검증된 월별 계약 쿼리와 같은 유효 사용자 관계를 강제하되, 딜러명 정책은 해당 쿼리의 독립 규칙을 유지한다.
    required_inner_join_tables: [DIM_MNG_USER, DIM_MNG_DEALER]
    apply_default_dealer_scope: false
    expression: "SUM(FCT_CONTRACT_KTWS.cnt)"
    metric_filter: null  # 취소 조건은 required_filters의 br_contract_cancel_exclusion_ytd가 담당
    aggregation: sum
    grain: [sales_consultant, year]
    time_dimension: FCT_CONTRACT_KTWS.contract_dt
    default_time_grain: year
    supported_time_grains: [year]
    required_filters: [br_contract_cancel_exclusion_ytd]
    exclusion_rules: [sc_scope_default]
