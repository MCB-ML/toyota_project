# [월별 판매 성취도 — 출고 (목표·실적·달성률)] Certified Report 계약
#
# ktws_측정값_쿼리화.xlsx "2-1. 월별 판매 성취도" NO=12의 최종 GOLD.

report_id: sales_achievement_delivery
version: v1
title: 월별 판매 성취도 — 출고 (목표·실적·달성률)
description: >
  연도 기준 출고 목표/실적과 달성률. 계약 쪽(sales_achievement_contract)과 짝을 이룬다.

sql_file: sql/sales_achievement_delivery.sql

source:
  workbook: docs/ktws_측정값_쿼리화.xlsx
  sheet: 2-1. 월별 판매 성취도
  no: 12
  gold_column: 최종 GOLD 쿼리
  deviations:
    - id: parameters_bound
      what: 파라미터 DECLARE 12개 제거
      why: 드라이버 바인딩으로 대체 — 문자열 치환 금지. 제외 상수(@Excl*)는 원문 유지.
    - id: pad_null_guard
      what: "콤마 패딩 변수 11개에 CASE NULL 가드 추가"
      why: >
        Fabric에서 ',' + NULL + ',' 는 ',,' 가 되어 "비우면 전체"가 "결과 없음"으로 뒤집힌다.

    - id: filter_trim_guard
      what: "LIKE 패딩 필터의 컬럼 값을 LTRIM(RTRIM())으로 감쌈 (34곳)"
      why: >
        차원 이름에 끝 공백이 들어간 값이 있다(2026-08-03 실측: DIM_MNG_USER 기준
        팀 7종/56명, SC 36종/36명, 전시장 1종/27명 — 총 44종 119명).
        패턴이 N'%,토요타 동대문 ,%' 가 되어 사용자가 넘긴 ',토요타 동대문,' 과
        매칭되지 않아 필터가 오류 없이 0건이 된다. NOT LIKE(제외 목록)도 같은 이유로
        제외에 실패해 빠져야 할 행이 남는다.
        숫자에서 만든 CAST(...) 표현식은 공백이 생길 수 없어 건드리지 않았다.
        재현·정량화: notebook/05_차원이름_공백_진단.ipynb
        주의: SQL Server의 = 비교는 끝 공백을 무시하므로 STRING_SPLIT 방식을 쓰는
        funnel_full_structure는 애초에 영향이 없어 수정 대상이 아니다.
      verified_on: 2026-08-03
sql_sha256: 1efd4c31cb4d9388c96343e5286d87da495bd12dd6f085855854475e22d08aba
execution:
  mode: single_query
  allow_llm_sql_rewrite: false
  parameter_binding: driver_bind
  preserve_total_row: false
  preserve_output_order: true
  preserve_column_order: true
  database: KPI_W

parameters:
  - { name: Year,      sql_type: nvarchar, nullable: true, multi_value: true, description: "연도. 다중 가능. 비우면 전체." }
  - { name: Brand,     sql_type: nvarchar, nullable: true, multi_value: true, description: "브랜드" }
  - { name: DealerNm,  sql_type: nvarchar, nullable: true, multi_value: true, authorization_dimension: dealer, description: "딜러" }
  - { name: GroupName, sql_type: nvarchar, nullable: true, multi_value: true, description: "전시장" }
  - { name: DeptNm,    sql_type: nvarchar, nullable: true, multi_value: true, description: "팀" }
  - { name: ActiveYn,  sql_type: nvarchar, nullable: true, multi_value: true, allowed_values: ['재직','퇴직'], description: "재직여부" }
  - name: ScName
    sql_type: nvarchar
    nullable: true
    multi_value: true
    schema_switching: true
    authorization_dimension: sales_consultant
    description: "NULL이면 SC 열 없음, 'ALL'이면 전체 SC, 값을 주면 해당 SC만"
  - { name: ModelNm,   sql_type: nvarchar, nullable: true, multi_value: true, description: "모델명" }
  - { name: VariantNm, sql_type: nvarchar, nullable: true, multi_value: true, description: "차종" }
  - { name: MyCd,      sql_type: nvarchar, nullable: true, multi_value: true, description: "연식" }
  - { name: SfxCd,     sql_type: nvarchar, nullable: true, multi_value: true, description: "SFX 코드" }
  - { name: AsOfDate,  sql_type: date, nullable: true, description: "기준일. 비우면 제한 없음." }

column_selection:
  applies_at: projection
  sql_parameter: false

# 브라우저 객체 필터로 내보낼 축. GOLD의 DECLARE 슬라이서 블록이 곧 BI 페이지의
# 슬라이서라, 기간(연·월·일)만 빼고 그대로 옮겼다. 결과에 그 컬럼이 실제로 있는
# 것만 넣는다 — 없는 컬럼을 내걸면 걸 대상이 없다.
filterable_dimensions:
  - { id: brand,             column: 브랜드 }
  - { id: dealer,            column: 딜러 }
  - { id: showroom,          column: 전시장 }
  - { id: department,        column: 팀 }
  - { id: active_status,     column: 재직여부 }
  - { id: sales_consultant,  column: SC }
  - { id: vehicle_model,     column: 모델 }
  - { id: vehicle_variant,   column: 차종 }
  - { id: vehicle_year,      column: 연식 }
  - { id: grade_sfx,         column: SFX }

dimension_columns:
  branch_a: ['연도', '브랜드', '딜러', '전시장', '팀', '재직여부', '모델', '차종', '연식', 'SFX', 'MonthAbbr']
  branch_b: ['연도', '브랜드', '딜러', '전시장', '팀', '재직여부', 'SC', '모델', '차종', '연식', 'SFX', 'MonthAbbr']

# 이 리포트는 모델×차종×연식×SFX까지 펼쳐진 상세를 돌려주는데, BI 화면(2-1)이 보여주는
# 것도 질문이 원하는 것도 "월별" 막대 하나다 — 조직 축은 필터이지 축이 아니다.
# 쪼개 달라는 요청이 없으면 월까지만 남긴다(딜러·전시장까지 남기면 조직 필터가 없는
# 질문에서 1,080행이 된다). 목표는 repeated_higher_grain_value라 접어도 계약이 선언한
# grain으로 중복 제거된 뒤 합산되므로 값이 부풀지 않는다.
# 2026-08-05 실측: 접기 전 19,749행(연 전체) / 519행(SC 한 명) — 둘 다 행 가드에 걸려
# "어느 단위로 묶을까요?"를 되물었고, 제시된 선택지는 모델별·차종별이었다(질문은 월별이었다).
# 모델·차종을 보고 싶은 질문은 group_by를 직접 채우므로 이 기본값이 가리지 않는다.
default_group_by: ['연도', 'MonthAbbr']

total_row: null

column_semantics:
  # 목표는 TGTM CTE가 모델/차종/연식/SFX 없이 집계한 상위 grain 값이고, 최종 SELECT에서
  # 모델 행마다 반복 표시된다(sales_achievement_contract의 '타겟'과 같은 구조).
  #
  # 2026-07-31 라이브 검증: 아래 grain으로 중복 제거하면 4월 누적 8,864,
  # 전월(6,721)과의 차 2,143이 Power BI "2-3. 출고 현황"의 출고 목표와 일치했다.
  '목표':
    type: repeated_higher_grain_value
    grain_branch_a: ['연도', 'MonthAbbr', '브랜드', '딜러', '전시장', '팀', '재직여부']
    grain_branch_b: ['연도', 'MonthAbbr', '브랜드', '딜러', '전시장', '팀', '재직여부', 'SC']
    direct_sum_forbidden: true
    correct_aggregation: grain 단위로 중복 제거 후 합산(SQL의 TGTM GROUP BY와 동일)

  # 실적은 행 단위 값이지만 연누적(YTD)이다 — 월별 값은 전월 누적과의 차다.
  '실적': { type: additive, grain: row }

  '달성률': { type: ratio, numerator: '실적', denominator: '목표', direct_average_forbidden: true, recompute_ratio: true, ratio_basis: target }

authorization:
  enforced: false
  reason: 서버측 인증/세션 미구현 — 다른 인증 리포트와 동일
  intersect_dimensions: ['DealerNm', 'ScName']
