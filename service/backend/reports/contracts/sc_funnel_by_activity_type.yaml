    nullable: true
    multi_value: true
    default: ['관계형성', '기회창출']   # 리스트로 둔다 — 콤마 포함 문자열은 검증기가 거부한다
    description: >
      활동유형분류. 원본 기본값이 '관계형성,기회창출'이라 그대로 둔다 —
      비우면 퍼널 정의에 없는 유형까지 섞여 화면과 숫자가 달라진다.

