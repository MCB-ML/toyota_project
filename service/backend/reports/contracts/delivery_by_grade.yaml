# [출고 현황 — 등급·SFX별 연누적] Certified Report 계약
#
# ktws_측정값_쿼리화.xlsx "2-3. 출고 현황" 페이지 NO=2의 최종 GOLD(v2 열).

report_id: delivery_by_grade
version: v2
title: 출고 현황 — 등급·SFX별 연누적
description: >
  GRADE(등급)와 SFX 조합별 연누적 출고 대수.

sql_file: sql/delivery_by_grade.sql

source:
  workbook: docs/ktws_측정값_쿼리화.xlsx
  sheet: 2-3. 출고 현황
  no: 2
  value_name: GRADE - ktws DIM_VEHIC_SPEC[grade] / SFX 별 출고 연누적
  gold_column: 최종 GOLD 쿼리 v2
  deviations:
    - id: parameters_bound
      what: 파라미터 DECLARE 13개 제거
      why: 드라이버 바인딩으로 대체 — 문자열 치환 금지. 제외 상수(@Excl*)는 원문 유지.
    - id: pad_null_guard
      what: "콤마 패딩 변수 12개(@pYear~@pSfxCd)에 CASE NULL 가드 추가"
      why: >
        이 페이지의 패딩은 ',' + @X + ',' 형태라 Fabric에서 @X가 NULL이면 ',,' 가 된다.
        가드가 없으면 슬라이서를 비웠을 때 결과가 통째로 비는, 의도와 정반대 동작이 된다.
        (activity_funnel_status에서 라이브로 확인된 것과 같은 문제. 변수 명명만 다르다.)

    - id: filter_trim_guard
      what: "LIKE 패딩 필터의 컬럼 값을 LTRIM(RTRIM())으로 감쌈 (21곳)"
      why: >
        차원 이름에 끝 공백이 들어간 값이 있다(2026-08-03 실측: DIM_MNG_USER 기준
        팀 7종/56명, SC 36종/36명, 전시장 1종/27명 — 총 44종 119명).
        패턴이 N'%,토요타 동대문 ,%' 가 되어 사용자가 넘긴 ',토요타 동대문,' 과
        매칭되지 않아 필터가 오류 없이 0건이 된다. NOT LIKE(제외 목록)도 같은 이유로
        제외에 실패해 빠져야 할 행이 남는다.
        숫자에서 만든 CAST(...) 표현식은 공백이 생길 수 없어 건드리지 않았다.
        재현·정량화: notebook/05_차원이름_공백_진단.ipynb
        주의: SQL Server의 = 비교는 끝 공백을 무시하므로 STRING_SPLIT 방식을 쓰는
        funnel_full_structure는 애초에 영향이 없어 수정 대상이 아니다.
      verified_on: 2026-08-03
sql_sha256: 16b31fdd054fcb6a6f744628c8945ab9c4a78149d29362196631ce1b66b7eac7
execution:
  mode: single_query
  allow_llm_sql_rewrite: false
  parameter_binding: driver_bind
  preserve_total_row: false
  preserve_output_order: true
  preserve_column_order: true
  database: KPI_W

parameters:
  - { name: Year,        sql_type: nvarchar, nullable: true, multi_value: true, description: "연도. 다중 가능. 비우면 전체." }
  - { name: MonthNumber, sql_type: nvarchar, nullable: true, multi_value: true, description: "월. 다중 가능. 비우면 전체." }
  - { name: Brand,       sql_type: nvarchar, nullable: true, multi_value: true, description: "DIM_MNG_USER[BRAND]" }
  - { name: DealerNm,    sql_type: nvarchar, nullable: true, multi_value: true, authorization_dimension: dealer, description: "DIM_MNG_DEALER[dealer_nm]" }
  - { name: GroupName,   sql_type: nvarchar, nullable: true, multi_value: true, description: "전시장" }
  - { name: DeptNm,      sql_type: nvarchar, nullable: true, multi_value: true, description: "팀" }
  - { name: ActiveYn,    sql_type: nvarchar, nullable: true, multi_value: true, allowed_values: ['재직','퇴직'], description: "재직여부" }
  - name: ScName
    sql_type: nvarchar
    nullable: true
    multi_value: true
    schema_switching: true
    authorization_dimension: sales_consultant
    description: >
      NULL → SC 열 없음. 'ALL' → SC 열 생김 + 전체 SC. 값 → SC 열 + 해당 SC만.
      출력 스키마가 바뀌므로 판단이 안 되면 되물어야 한다.
  - { name: ModelNm,   sql_type: nvarchar, nullable: true, multi_value: true, description: "모델명" }
  - { name: VariantNm, sql_type: nvarchar, nullable: true, multi_value: true, description: "차종" }
  - { name: MyCd,      sql_type: nvarchar, nullable: true, multi_value: true, description: "연식" }
  - { name: SfxCd,     sql_type: nvarchar, nullable: true, multi_value: true, description: "SFX 코드" }
  - name: AsOfDate
    sql_type: date
    nullable: true
    description: 기준일. 비우면 제한 없음(원본 기본값 NULL).

column_selection:
  applies_at: projection
  sql_parameter: false

# 이 리포트의 기간 의미. GOLD가 출고일자를 year_start ~ month_end 로 잡아
# **연누적**을 낸다 — 사용자가 "4월"이라 물어도 결과는 1~4월 누적이다.
# 답변 요약에 그대로 밝힌다. 이 선언이 없으면 사용자는 그 달만으로 오해한다.
# 2026-08-05 실측(2026-04 렉서스 부산 영업6팀): 55행의 출고일자가 1~4월에 걸쳐 있다.
period_semantics:
  type: ytd
  label: 연누적(1월~선택 월)
  # "그 달에 출고된 것만" 을 물으면 이 컬럼에 YYYY-MM 을 dimension_filters로 건다.
  # GOLD는 연누적만 내므로 행에서 거르는 것 말고는 방법이 없다.
  month_filter_column: 출고일자

# ScName이 NULL이면 SC 열이 없고, 값이 있으면 SC 열이 생긴다(출력 스키마가 바뀐다).
# 브라우저 객체 필터로 내보낼 축. GOLD의 DECLARE 슬라이서 블록이 곧 BI 페이지의
# 슬라이서라, 기간(연·월·일)만 빼고 그대로 옮겼다. 결과에 그 컬럼이 실제로 있는
# 것만 넣는다 — 없는 컬럼을 내걸면 걸 대상이 없다.
filterable_dimensions:
  - { id: brand,             column: 브랜드 }
  - { id: dealer,            column: 딜러 }
  - { id: showroom,          column: 전시장 }
  - { id: department,        column: 팀 }
  - { id: active_status,     column: 재직여부 }
  - { id: sales_consultant,  column: SC }
  - { id: vehicle_model,     column: 모델 }
  - { id: vehicle_variant,   column: 차종 }
  - { id: vehicle_year,      column: 연식 }
  - { id: grade_sfx,         column: SFX }

dimension_columns:
  branch_a: ['연도', '월', '브랜드', '딜러', '전시장', '팀', '재직여부', '모델', '차종', '연식', 'SFX', 'GRADE']
  branch_b: ['연도', '월', '브랜드', '딜러', '전시장', '팀', '재직여부', 'SC', '모델', '차종', '연식', 'SFX', 'GRADE']

# 합계 행을 만들지 않는다.
total_row: null

column_semantics:
  '출고연누적': { type: additive, grain: row, note: "연누적 출고 대수" }

authorization:
  enforced: false
  reason: 서버측 인증/세션 미구현 — 다른 인증 리포트와 동일
  intersect_dimensions: ['DealerNm', 'ScName']
