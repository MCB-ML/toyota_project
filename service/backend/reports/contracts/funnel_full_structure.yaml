      2026-04 실측(브랜드 TOYOTA+LEXUS): 상세합 3,461, 합계행 3,475.
      다른 grain의 값이 필요하면 funnelDerived가 overall_* CTE를 그 grain으로 다시 돌린다.

  '시승 당월 목표':
    type: separate_total_cte
    direct_sum_forbidden: true
    derived_metric: testdrive_target
    note: >
      상세 행에서는 복구할 수 없다. GOLD가 상세용 CTE와 합계용 overall_* CTE를 따로
      두고 자격 조건도 다르게 걸기 때문에, 더하든 중복 제거하든 합계가 나오지 않는다.
      2026-04 실측(브랜드 TOYOTA+LEXUS): 상세합 41,872, 합계행 5,234.
      다른 grain의 값이 필요하면 funnelDerived가 overall_* CTE를 그 grain으로 다시 돌린다.

  '시승에서 계약으로 당월활동실적':
    type: distinct_count
    direct_sum_forbidden: true
    derived_metric: testdrive_to_contract_actual
    note: >
      COUNT(DISTINCT lead_key) 기반이라 셀을 더해도 상위 합계가 나오지 않는다.
      라이브 확인(2026-04 재직+브랜드): 상세 행 합은 기회 8,624 / 계약 1,525 인데
      SQL 합계행은 8,692 / 1,532 이다 — 합계는 overall_* CTE가 따로 DISTINCT 계산한다.
      다른 grain의 값이 필요하면 그 grain으로 리포트를 다시 조회할 것.
  '시승에서 계약으로 당월전체실적':
    type: distinct_count
    direct_sum_forbidden: true
    derived_metric: testdrive_to_contract_total
    note: >
      COUNT(DISTINCT lead_key) 기반이라 셀을 더해도 상위 합계가 나오지 않는다.
      라이브 확인(2026-04 재직+브랜드): 상세 행 합은 기회 8,624 / 계약 1,525 인데
      SQL 합계행은 8,692 / 1,532 이다 — 합계는 overall_* CTE가 따로 DISTINCT 계산한다.
