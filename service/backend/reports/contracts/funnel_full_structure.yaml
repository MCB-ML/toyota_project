  '영업활동 진행률': { type: ratio, numerator: '영업활동 건 수', denominator: '영업활동 당월 목표',
      direct_average_forbidden: true, recompute_ratio: true, ratio_basis: target }
  '영업활동에서 영업기회로의 전환율': { type: ratio, numerator: '영업기회 건 수(당월활동실적)', denominator: '영업활동 건 수',
      direct_average_forbidden: true, recompute_ratio: true, ratio_basis: stage }
  '영업기회 진행률': { type: ratio, numerator: '영업기회 건 수(당월활동실적)', denominator: '영업기회 당월 목표',
      direct_average_forbidden: true, recompute_ratio: true, ratio_basis: target }
  '영업기회에서 계약으로 전환율': { type: ratio, numerator: '계약건수(당월활동실적)', denominator: '영업기회 건 수(당월활동실적)',
      direct_average_forbidden: true, recompute_ratio: true, ratio_basis: stage }
  # 이 비율만 분자를 다시 만들 수 없다. GOLD는 표시되는 계약건수와 **다른 값**을 분자로 쓴다:
  #   COALESCE(CAC.cnt, 0) AS [계약건수(당월활동실적)]   ← overall_contract_activity_count
  #   CPC.cnt / CT.cnt     AS [계약 진행률]              ← overall_contract_progress_count
  # 두 CTE는 lead pool 한 줄이 다르다(overall_lead_activity_pool vs
  # overall_contract_progress_lead_pool). CPC는 리포트 컬럼으로 나오지 않아 재계산이 불가능하다.
  #
  # 2026-08-05 실측(2026-04 렉서스 강남): GOLD 35.49% = 208/586.
  # 표시 계약건수로 재계산하면 264/586 = 45.05% 로 9.6%p 부풀려진다.
  # 그래서 recompute_ratio를 걸지 않는다 — 롤업 시 틀린 값을 내느니 비운다.
  # GOLD가 직접 낸 행에서는 그대로 정확한 값이 나온다.
  '계약 진행률': { type: ratio, denominator: '계약 당월 목표',
      direct_average_forbidden: true, direct_sum_forbidden: true, ratio_basis: target,
      recompute_impossible: '분자(overall_contract_progress_count)가 출력 컬럼으로 나오지 않는다' }
  '영업기회에서 시승으로 전환율': { type: ratio, numerator: '시승건수(당월활동실적/시승완료)', denominator: '영업기회 건 수(당월활동실적)',
      direct_average_forbidden: true, recompute_ratio: true, ratio_basis: stage }
