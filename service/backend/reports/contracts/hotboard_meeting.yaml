# ktws_측정값_쿼리화.xlsx "6. 핫보드" NO=1의 최종 GOLD.

report_id: hotboard_meeting
version: v1
title: 핫보드 회의 (HOT 리드 회의록)
description: >
  HOT 등급 영업기회를 놓고 진행한 회의 기록. 회차·미팅일자·상담자·관심차종·금주 계약 가능성·경쟁차종·보유차종·지불유형을 담는다.

sql_file: sql/hotboard_meeting.sql

source:
  workbook: docs/ktws_측정값_쿼리화.xlsx
  sheet: 6. 핫보드
  no: 1
  gold_column: 최종 GOLD 쿼리
  deviations:
    - id: parameters_bound
      what: 파라미터 DECLARE 10개 제거
      why: 드라이버 바인딩으로 대체 — 문자열 치환 금지. 제외 상수는 원문 유지.
    - id: pad_null_guard
      what: "콤마 패딩 변수 10개에 CASE NULL 가드 추가(@sc_filterPad 포함)"
      why: >
        Fabric에서 ',' + NULL + ',' 는 ',,' 가 되어 "비우면 전체"가 "결과 없음"으로 뒤집힌다.
        @sc_filterPad도 포함한다 — @sc_filter는 sc_name='ALL'일 때 NULL이 되도록
        설계돼 있어, 가드가 없으면 "전체 SC"가 0행이 된다(라이브로 확인: 91행 → 0행).

    - id: filter_trim_guard
      what: "LIKE 패딩 필터의 컬럼 값을 LTRIM(RTRIM())으로 감쌈 (18곳)"
      why: >
        차원 이름에 끝 공백이 들어간 값이 있다(2026-08-03 실측: DIM_MNG_USER 기준
        팀 7종/56명, SC 36종/36명, 전시장 1종/27명 — 총 44종 119명).
        패턴이 N'%,토요타 동대문 ,%' 가 되어 사용자가 넘긴 ',토요타 동대문,' 과
        매칭되지 않아 필터가 오류 없이 0건이 된다. NOT LIKE(제외 목록)도 같은 이유로
        제외에 실패해 빠져야 할 행이 남는다.
        숫자에서 만든 CAST(...) 표현식은 공백이 생길 수 없어 건드리지 않았다.
        재현·정량화: notebook/05_차원이름_공백_진단.ipynb
        주의: SQL Server의 = 비교는 끝 공백을 무시하므로 STRING_SPLIT 방식을 쓰는
        funnel_full_structure는 애초에 영향이 없어 수정 대상이 아니다.
      verified_on: 2026-08-03
sql_sha256: fd0080cd853a1f4ebd82295dca65de59e1e1ab08199ec8cdb4788417e7481cb2
execution:
  mode: single_query
  allow_llm_sql_rewrite: false
  parameter_binding: driver_bind
  preserve_total_row: false
  preserve_output_order: true
  preserve_column_order: true
  database: KPI_W

parameters:
  - name: base_year
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: "연도. 다중 가능. 비우면 전체"
  - name: base_month
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: "월. 다중 가능. 비우면 전체"
  - name: meet_round
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: "회차(meet_ym_seq). 비우면 전체 회차"
  - name: brand
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: "DIM_MNG_USER[BRAND]"
  - name: dealer_nm
    sql_type: nvarchar
    nullable: true
    multi_value: true
    authorization_dimension: dealer
    description: "DIM_MNG_DEALER[dealer_nm]"
  - name: group_name
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: "전시장(group_name)"
  - name: dept_nm
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: "팀/부서(dept_nm)"
  - name: active_yn
    sql_type: nvarchar
    nullable: true
    multi_value: true
    allowed_values: ['재직', '퇴직']
    description: "재직여부"
  - name: sc_name
    sql_type: nvarchar
    nullable: true
    multi_value: true
    # 다른 리포트와 달리 여기서는 SC가 grain을 바꾸지 않는다 — 행은 회의 기록 단위라
    # NULL/'ALL' 모두 92행(2026-04 실측)으로 같고 SC 열 값만 채워진다.
    # 따라서 "SC별로 볼까요 팀 단위로 볼까요"를 되묻지 않는다(되물어도 표가 안 바뀐다).
    schema_switching: false
    default: 'ALL'  # 행 수가 같고 SC 열이 채워지므로 비워두는 것보다 항상 낫다
    authorization_dimension: sales_consultant
    description: "SC 열 값 채우기. NULL → SC 열 공백 / 'ALL' → 전체 SC / 값 → 해당 SC만 (행 수는 동일)"
  - name: variant_nm
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: "관심차종(variant_nm)"

column_selection:
  applies_at: projection
  sql_parameter: false

# 브라우저 객체 필터로 내보낼 축. GOLD의 DECLARE 슬라이서 블록이 곧 BI 페이지의
# 슬라이서라, 기간(연·월·일)만 빼고 그대로 옮겼다. 결과에 그 컬럼이 실제로 있는
# 것만 넣는다 — 없는 컬럼을 내걸면 걸 대상이 없다.
filterable_dimensions:
  - { id: department,        column: 팀 }
  - { id: sales_consultant,  column: SC }

dimension_columns:
  branch_a: ['연도', '월', '회차', '미팅일자', '상태', '팀', '상담자', '확보유형', '관심차종', 'HOT 등록일', 'BOARD 등록일', '다음 활동 예정일', '금주 계약 가능성', '메모(회의 등록)', '경쟁차종', '현재 보유차종', '현재 보유차종(상세)', '지불 유형']
  branch_b: ['연도', '월', '회차', '미팅일자', '상태', '팀', '상담자', '확보유형', '관심차종', 'HOT 등록일', 'BOARD 등록일', '다음 활동 예정일', '금주 계약 가능성', '메모(회의 등록)', '경쟁차종', '현재 보유차종', '현재 보유차종(상세)', '지불 유형', 'SC']

total_row: null

# 회의 기록 목록이라 측정값이 없다. '금주 계약 가능성'은 등급 표시값이지 수치가 아니다.
column_semantics:
