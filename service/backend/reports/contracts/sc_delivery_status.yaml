# [SC 출고 현황] Certified Report 계약
#
# ktws_측정값_쿼리화.xlsx "7. SC 출고 현황" 페이지 NO=1의 '최종 통합 GOLD 쿼리'.
# 지금까지 등록한 리포트가 전부 활동→기회→계약 퍼널이었던 것과 달리,
# 이건 출고(delivery) 영역이다 — 월평균 출고, 누적취소율, PMA IN/OUT, SC 등급 분포.

report_id: sc_delivery_status
version: v1
title: SC 출고 현황 (월평균 출고·누적취소율·PMA)
description: >
  연×월 기준 SC별 월평균 출고대수와 누적취소율을 내고, 그 값으로 SC를 A/B/C 등급으로
  분류한다. PMA IN/OUT(담당 권역 내외 출고) 비중도 함께 낸다. 브랜드/딜러/전시장/팀
  (선택 시 SC)×모델·차종·연식·SFX 레벨로 볼 수 있다.

sql_file: sql/sc_delivery_status.sql

source:
  workbook: docs/ktws_측정값_쿼리화.xlsx
  sheet: 7. SC 출고 현황
  no: 1
  value_name: 브랜드별 / 딜러사별 / 그룹별 / 팀별 출고평균대수, 누적취소율 도넛차트
  gold_column: 최종 통합 GOLD 쿼리
  original_length: 23592
  deviations:
    - id: parameters_bound
      what: 파라미터 DECLARE 21개 제거(슬라이서 16개 + 동작 토글 5개)
      why: 드라이버 바인딩으로 대체 — 문자열 치환 금지.
    - id: pad_null_guard
      what: "NULL 가능한 pad 변수 13개에 CASE WHEN @X IS NULL THEN NULL ELSE ... END 추가"
      why: >
        Fabric에서 N',' + NULL + N',' 는 ',,' 가 되어 "NULL=전체"가 뒤집힌다.
        상수 파생 pad(@excl_*)와 여러 줄에 걸친 @sc_filterPad는 손대지 않았다.

    - id: filter_trim_guard
      what: "LIKE 패딩 필터의 컬럼 값을 LTRIM(RTRIM())으로 감쌈 (25곳)"
      why: >
        차원 이름에 끝 공백이 들어간 값이 있다(2026-08-03 실측: DIM_MNG_USER 기준
        팀 7종/56명, SC 36종/36명, 전시장 1종/27명 — 총 44종 119명).
        패턴이 N'%,토요타 동대문 ,%' 가 되어 사용자가 넘긴 ',토요타 동대문,' 과
        매칭되지 않아 필터가 오류 없이 0건이 된다. NOT LIKE(제외 목록)도 같은 이유로
        제외에 실패해 빠져야 할 행이 남는다.
        숫자에서 만든 CAST(...) 표현식은 공백이 생길 수 없어 건드리지 않았다.
        재현·정량화: notebook/05_차원이름_공백_진단.ipynb
        주의: SQL Server의 = 비교는 끝 공백을 무시하므로 STRING_SPLIT 방식을 쓰는
        funnel_full_structure는 애초에 영향이 없어 수정 대상이 아니다.
      verified_on: 2026-08-03
sql_sha256: 72dc6c2184a2abd6506d6ac1716b77622c6c8ff4b2822384939e008978e75322
execution:
  mode: single_query
  allow_llm_sql_rewrite: false
  parameter_binding: driver_bind
  preserve_total_row: true
  preserve_output_order: true
  preserve_column_order: true
  database: KPI_W

parameters:
  - name: year
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: "연도. 다중 가능. 비우면 전체 연도."
  - name: month
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: "월. 다중 가능. 비우면 전체 월."
  - name: active_yn
    sql_type: nvarchar
    nullable: true
    multi_value: true
    allowed_values: ['재직', '퇴직']
    description: DIM_MNG_USER[active_yn]
  - name: age_grp
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: SC 근속 연차 그룹.
  - name: sc_brand
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: >
      조직 브랜드(SC가 속한 브랜드). BI 화면의 '브랜드' 슬라이서가 이것이다 —
      차량 브랜드(@brand)와 다르니 혼동하지 말 것.
  - name: dealer_nm
    sql_type: nvarchar
    nullable: true
    multi_value: true
    authorization_dimension: dealer
    description: DIM_MNG_DEALER[dealer_nm]
  - name: group_name
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: 전시장
  - name: dept_nm
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: 팀
  - name: sc_name
    sql_type: nvarchar
    nullable: true
    multi_value: true
    schema_switching: false   # 열 구성은 그대로고 집계 grain만 바뀐다(라이브 확인)
    authorization_dimension: sales_consultant
    description: >
      NULL → 팀 레벨로 묶임(211행). 'ALL' → SC 단위(2,603행). 값 → 해당 SC만.
      원본 DECLARE 기본값은 'ALL'이지만 여기서는 default를 두지 않는다 —
      두면 NULL이 덮여 팀 레벨을 요청할 방법이 사라진다(@team_level은
      CASE WHEN @sc_name IS NULL로 결정되므로 NULL이 전달돼야 한다).
  - name: brand
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: 차량 브랜드. 조직 브랜드(@sc_brand)와 다르다.
  - name: model_nm
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: 모델명
  - name: variant_nm
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: 차종(variant)
  - name: my_cd
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: 연식(model year)
  - name: sfx_cd
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: SFX 코드
  - name: grp_category
    sql_type: nvarchar
    nullable: true
    allowed_values: ['누적 취소율', '출고평균대수']
    description: 등급 분류 기준. 비우면 전체.
  - name: grp_name
    sql_type: nvarchar
    nullable: true
    allowed_values: ['A', 'B', 'C']
    description: 등급 필터. 비우면 전체 등급.
  - name: period_cancel
    sql_type: int
    nullable: true
    min: 1
    max: 24
    default: 6
    description: 누적취소율을 계산할 개월 수. 원본 기본값 6.
  - name: period_avg
    sql_type: int
    nullable: true
    min: 1
    max: 24
    default: 6
    description: 월평균 출고를 계산할 개월 수. 원본 기본값 6.
  - name: drop_empty_duplicates
    sql_type: int
    nullable: true
    default: 1
    description: 빈 중복 행 제거 여부(0/1). 원본 기본값 1.
  - name: exclude_no_activity
    sql_type: int
    nullable: true
    default: 0
    description: 활동 없는 SC 제외 여부(0/1). 원본 기본값 0.
  - name: sort_by_name
    sql_type: int
    nullable: true
    default: 1
    description: SC명 정렬 여부(0/1). 원본 기본값 1.

column_selection:
  applies_at: projection
  sql_parameter: false

# 다른 리포트와 달리 SC 열이 두 분기 모두에 존재한다(라이브 확인) — sc_name이
# 바꾸는 것은 출력 스키마가 아니라 집계 grain이다.
#   sc_name=NULL  → 팀 레벨   211행 (SC 열은 있지만 팀 단위로 묶임)
#   sc_name='ALL' → SC 레벨 2,603행
# 브라우저 객체 필터로 내보낼 축. GOLD의 DECLARE 슬라이서 블록이 곧 BI 페이지의
# 슬라이서라, 기간(연·월·일)만 빼고 그대로 옮겼다. 결과에 그 컬럼이 실제로 있는
# 것만 넣는다 — 없는 컬럼을 내걸면 걸 대상이 없다.
filterable_dimensions:
  - { id: brand,             column: 브랜드 }
  - { id: dealer,            column: 딜러 }
  - { id: showroom,          column: 전시장 }
  - { id: department,        column: 팀 }
  - { id: sales_consultant,  column: SC }
  - { id: vehicle_model,     column: 모델 }
  - { id: vehicle_variant,   column: 차종 }
  - { id: vehicle_year,      column: 연식 }
  - { id: grade_sfx,         column: SFX }

dimension_columns:
  branch_a: &sc_dims ['연도', '월', 'no.', '브랜드', '딜러', '전시장', '팀', 'SC', 'sc_key', '평가기준', '그룹분류', '모델', '차종', '연식', 'SFX']
  branch_b: *sc_dims

# 합계 행은 grand CTE가 만든다. 다른 리포트와 달리 '합계' 표시가 딜러가 아니라
# 브랜드 컬럼에 들어간다(N'합계' AS [브랜드], 딜러·전시장·팀·SC는 NULL).
# 한때 딜러 컬럼으로 찾도록 잘못 써서 "합계 행이 없다"고 오판한 적이 있다.
total_row:
  detect_by: { column: '브랜드', equals: '합계' }
  note: >
    합계행의 월평균 출고는 total_avg(전체 6개월 출고합의 월평균)를 SC수로 나눈 값이고,
    누적취소율·PMA 비중도 분자·분모를 다시 합산해 계산한다 — 상세 행을 더한 것이 아니다.

# 질문에 쓰이는 말 → 표시 컬럼. LLM이 selected_columns를 비워 보낼 때만 쓴다.
#
# 이 리포트는 28열을 낸다. 다 내보내면 묻지 않은 지표가 답에 섞이고, LLM이 좁힐 때와
# 답이 갈린다 — 2026-08-11 실측(평가 No.49): 12회 중 7회는 PMA IN·OUT 두 열만,
# 5회는 28열 전부가 나왔다. 값은 같은데 답의 모양이 달라진다.
column_aliases:
  'PMA IN': ['PMA IN', 'PMA인']
  'PMA OUT': ['PMA OUT', 'PMA아웃']
  'PMA IN 비중': ['PMA IN 비중', 'PMA IN 비율']
  'PMA OUT 비중': ['PMA OUT 비중', 'PMA OUT 비율']
  '월평균 출고': ['월평균 출고', '월 평균 출고']
  '누적취소율': ['누적취소율', '누적 취소율']
  '연누적 출고': ['연누적 출고', '연간 누적 출고']

# ── 컬럼 의미론 ─────────────────────────────────────────────────────────────
# 이 리포트의 핵심 측정값은 대부분 "평균"이나 "비율"이라 직접 합산이 위험하다.
column_semantics:
  'SC수':   { type: additive, grain: row }
  'A':      { type: additive, grain: row, note: A등급 SC 수 }
  'B':      { type: additive, grain: row, note: B등급 SC 수 }
  'C':      { type: additive, grain: row, note: C등급 SC 수 }
  '미분류': { type: additive, grain: row }
  '연누적 출고': { type: additive, grain: row }
  'PMA IN':      { type: additive, grain: row }
  'PMA OUT':     { type: additive, grain: row }

  '월평균 출고':
    type: average
    direct_sum_forbidden: true
    direct_average_forbidden: true
    note: >
      period_avg개월 평균이라 행을 더하면 의미가 없고, 행 평균도 SC마다 모수가 달라
      틀린다. 이 리포트에는 합계 행이 없으므로, 상위 레벨 값이 필요하면
      원하는 grain(예: 팀 레벨 sc_name=NULL)으로 다시 조회할 것.
  '누적취소율':
    type: opaque_ratio      # 분자·분모가 출력에 없어 재계산 자체가 불가능하다
    direct_sum_forbidden: true
    direct_average_forbidden: true
    recompute_ratio: false
    note: >
      period_cancel개월 누적 기준 취소율. 분자(취소 건수)·분모(계약 건수)가 출력
      컬럼으로 나오지 않아 다른 grain으로 재계산할 방법이 없다. 합계 행도 없으므로
      다른 레벨의 값이 필요하면 그 grain으로 다시 조회해야 한다.
  'PMA OUT 비중':
    type: ratio
    ratio_basis: stage
    numerator: 'PMA OUT'
    denominator: '연누적 출고'
    direct_average_forbidden: true
    recompute_ratio: true
  'PMA IN 비중':
    ratio_basis: stage
    type: ratio
    numerator: 'PMA IN'
    denominator: '연누적 출고'
    direct_average_forbidden: true
    recompute_ratio: true

format:
  percentage: ['누적취소율', 'PMA IN 비중', 'PMA OUT 비중']
  integer: ['SC수', 'A', 'B', 'C', '미분류', '연누적 출고', 'PMA IN', 'PMA OUT']
  decimal: ['월평균 출고']

authorization:
  enforced: false
  reason: 서버측 인증/세션 미구현 — 다른 인증 리포트와 동일
  intersect_dimensions: ['dealer_nm', 'sc_name']
