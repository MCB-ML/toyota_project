# [활동 퍼널 현황] Certified Report 계약
#
# 이 리포트는 "지표 11개를 모아 만든 것"이 아니라 하나의 리포트 프로그램이다.
# 계약목표·계약진행률이 활동유형보다 상위 grain에서 계산돼 상세 행에 반복 표시되고,
# 합계에서만 sc_first=1로 한 번만 집계된다. 이 규칙은 지표별 SQL을 따로 실행해
# 애플리케이션에서 병합하는 방식으로는 재현할 수 없다 — 그래서 GOLD SQL을 그대로 실행한다.

report_id: activity_funnel_status
version: v3
title: 활동 퍼널 현황
description: >
  연×월 기준 활동→기회→계약 퍼널 11개 지표를 딜러/전시장/팀(선택 시 SC)×활동유형
  레벨로 집계하고 합계 행을 덧붙인 표. Power BI [활동 퍼널 현황] 화면과 동일.

sql_file: sql/activity_funnel_status_v3.sql

# 원본 추적. 등록 SQL은 아래 GOLD 원문에서 딱 두 가지만 바꿔 생성했고, 둘 다 로직이 아니다.
# reports.test.js가 두 파일을 줄 단위로 대조해 그 외 변경이 없음을 고정한다.
source:
  sql_id: SQL_2a85a8c6b77b
  path: server/reports/sources/SQL_2a85a8c6b77b.sql
  sha256: 3186386674215c3db0d20e1a95487a7578508fee6b9cbb5df5a0a60ee4c5e688
  deviations:
    - id: parameters_bound
      what: 파라미터 DECLARE 10개 제거(@metric 포함)
      why: 드라이버 바인딩으로 대체 — 문자열 치환 금지
    - id: truncated_trailing_comment_closed
      what: 파일 끝 문서 주석에 '*/' 보충
      why: >
        원본 파일이 "● 계약목"에서 잘려 주석이 닫히지 않았다. 그대로는 SQL Server가
        "Missing end comment mark '*/'"로 거부해 실행 자체가 불가능하다(라이브 확인).
        마지막 실행문 뒤의 순수 주석이라 로직 영향은 없다.
    - id: pad_null_guard
      what: "@*Pad 7개에 CASE WHEN @X IS NULL THEN NULL ELSE ... END 가드 추가"
      why: >
        Fabric에서 N',' + NULL + N',' 는 NULL이 아니라 ',,' 가 된다. 그래서 @*Pad가
        NULL이 되지 않아 (@Pad IS NULL OR ...) 가드가 무력화되고 ',,' LIKE '%,값,%' 가
        항상 거짓이 되어 elig_user가 0명이 된다 — "NULL=전체"가 "NULL=결과 없음"으로
        뒤집힌다. 라이브 확인: 가드 없으면 전체 리포트가 빈 결과(상세 0행),
        가드 적용 시 2026-04 기준 상세 956행. 의미를 보존하는 최소 수정이다.
      verified_on: 2026-07-29
    - id: pbi_measure_alignment
      what: >
        자격활동 EXISTS에서 상관 조건 제거 — lead_actual의 SC 상관·활동유형 상관,
        cntrct_actual의 SC 상관·활동유형 상관·활동그룹·부재중 제외.
      why: >
        GOLD v3는 11개 시각적 개체를 한 쿼리로 단일화하면서 활동유형을 필터 컨텍스트가
        아니라 결과 컬럼으로 바꿨고, 그 과정에서 자격활동에 상관 조건이 붙었다. 그 결과
        Power BI 화면보다 기회실적 −73, 계약실적 −60이 나왔다(2026-04 재직 기준).
        조건별 실측 분해로 각 조건이 몇 건을 걷어내는지 확인한 뒤, 화면 숫자에 맞추기로
        결정해 해당 조건만 제거했다. 기간·오픈판정·리드 상관 등 나머지 로직은 그대로다.
        주의: 기회실적은 활동그룹·부재중 조건을 유지해야 PBI와 맞고, 계약실적은 그것까지
        빼야 맞는다 — 두 측정값의 정의가 원래 다르다.
      measured:
        기회실적: { gold_v3: 8624, pbi: 8697, after: 8696 }
        계약실적: { gold_v3: 1550, pbi: 1610, after: 1611 }
      note: 1건 차이는 스크린샷 시점 이후의 데이터 변동으로 보인다.
      decided_by: 사용자 (2026-07-29) — "PowerBI에 맞춰"
      verified_on: 2026-07-29
      superseded_by: pbi_measure_alignment_v2
    - id: pbi_measure_alignment_v2
      what: 계약실적(cntrct_actual)의 자격활동 EXISTS에 SC 상관·활동유형 상관을 되살림
      why: >
        2026-07-29 정렬의 기준이 틀렸다. 그때 맞춘 스크린샷에는 브랜드 필터가 빠져 있었는데,
        실제 BI 페이지는 모두 TOYOTA+LEXUS를 체크해 브랜드 공백 데이터를 제외한 상태다.
        올바른 기준으로 다시 재보니 계약 쪽은 상관을 걸어야 맞았다.
        먼저 필터 차이부터 배제했다 — 재직·브랜드를 걸어도 1건만 움직여(1,587→1,586)
        나머지 52가 진짜 정의 차이임을 확인한 뒤 조건별로 분해했다:
          상관 없음 1,586 → 활동유형 상관 1,539 → SC 상관까지 1,533
        근거는 검증된 1-1 GOLD(funnel_full_structure)의 contract_activity_count CTE —
        lead_activity_pool과 valid_type을 SC·활동유형으로 상관 조인한다.
      measured_2026_04_brand_only:   # 브랜드 TOYOTA+LEXUS만 적용(웹 BI와 같은 조건)
        기회실적: { report_1_2: 8728, report_1_1: 8728, pbi_web: 8728 }   # 세 값 완전 일치
        활동실적: { report_1_2: 47718, report_1_1: 47718 }
        계약실적: { report_1_2: 1531, report_1_1: 1533 }                  # 2건 차이 = 조회 시점 변동
      measured_with_active_filter:   # 참고: 재직까지 걸었을 때
        계약실적: { before_fix: 1586, after_fix: 1531 }
      note: >
        한때 "기회가 웹 BI보다 32 낮다"고 봤던 것은 웹 BI에 없는 재직 필터를 이쪽에만
        걸어서 생긴 착시였다. 같은 조건(브랜드만)으로 맞추면 8,728로 정확히 일치한다.
        근거가 불확실할 때 맞추지 않은 것이 옳았다 — 맞췄다면 정확한 값을 망쳤을 것이다.
        1-1과 1-2는 활동·기회가 완전히 같고 계약도 2건 차이라, "같은 쿼리 데이터를
        다르게 시각화한 것"이라는 설명과 부합한다.
      decided_by: 사용자 (2026-07-31) — 원인 규명 후 수정 지시
      verified_on: 2026-07-31

    - id: filter_trim_guard
      what: "LIKE 패딩 필터의 컬럼 값을 LTRIM(RTRIM())으로 감쌈 (23곳)"
      why: >
        차원 이름에 끝 공백이 들어간 값이 있다(2026-08-03 실측: DIM_MNG_USER 기준
        팀 7종/56명, SC 36종/36명, 전시장 1종/27명 — 총 44종 119명).
        패턴이 N'%,토요타 동대문 ,%' 가 되어 사용자가 넘긴 ',토요타 동대문,' 과
        매칭되지 않아 필터가 오류 없이 0건이 된다. NOT LIKE(제외 목록)도 같은 이유로
        제외에 실패해 빠져야 할 행이 남는다.
        숫자에서 만든 CAST(...) 표현식은 공백이 생길 수 없어 건드리지 않았다.
        재현·정량화: notebook/05_차원이름_공백_진단.ipynb
        주의: SQL Server의 = 비교는 끝 공백을 무시하므로 STRING_SPLIT 방식을 쓰는
        funnel_full_structure는 애초에 영향이 없어 수정 대상이 아니다.
      verified_on: 2026-08-03
# 실행 직전 본문 해시가 이 값과 다르면 실행을 거부한다.
# LLM이든 코드든 등록 SQL을 바꿔치기할 수 없게 하는 장치.
sql_sha256: 032b517d2b7692bc6f63478ddd4f16de46a23f6daf66b2eb8b5f2e83e35d8515
execution:
  mode: single_query          # 11개 지표 SQL로 쪼개지 않는다
  allow_llm_sql_rewrite: false
  parameter_binding: driver_bind   # 문자열 치환 금지. mssql request.input() 사용
  preserve_total_row: true
  preserve_output_order: true
  preserve_column_order: true
  # DB명이다. ktws는 이 DB 안의 스키마(테이블이 ktws.FCT_* 형태) — 혼동 주의.
  # server/agenticBiPipeline.js의 FABRIC_DB와 같은 값이어야 한다.
  database: KPI_W

# ── 파라미터 ────────────────────────────────────────────────────────────────
# 전부 NULL 허용 = 전체. 다중 값은 LIKE 패딩(',값1,값2,') 비교라서
# 값 자체에 콤마가 들어가면 필터가 불가능하다(원본 GOLD의 알려진 한계).
parameters:
  - name: Year
    sql_type: int
    nullable: true
    description: 연도. NULL이면 전체 연도가 월별 행으로 나온다.
  - name: MonthNumber
    sql_type: int
    nullable: true
    min: 1
    max: 12
    description: 월 1~12. NULL이면 전체 월.
  - name: Brand
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: DIM_MNG_USER[BRAND]
  - name: DealerNm
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: DIM_MNG_DEALER[dealer_nm]
    authorization_dimension: dealer     # 권한 교집합이 적용될 축(서버 인증 도입 시)
  - name: GroupName
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: DIM_MNG_USER[group_name] 전시장
  - name: DeptNm
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: DIM_MNG_USER[dept_nm] 팀
  - name: ActYn
    sql_type: nvarchar
    nullable: true
    multi_value: true
    allowed_values: ['재직', '퇴직']
    description: DIM_MNG_USER[active_yn]
  - name: ScName
    sql_type: nvarchar
    nullable: true
    multi_value: true
    schema_switching: true    # ★ 필터가 아니라 출력 스키마/grain을 바꾼다
    authorization_dimension: sales_consultant
    description: >
      NULL → SC 열 없음(딜러/전시장/팀 레벨). 'ALL' → SC 열 표시 + 전체 SC.
      값 → SC 열 표시 + 해당 SC만. 세 상태는 서로 다른 표이므로 임의로 기본값을
      고르지 말고 판단이 안 되면 사용자에게 되물어야 한다.
  - name: CommonTpNm
    sql_type: nvarchar
    nullable: true
    multi_value: true
    description: DIM_CRM_ACT_TYPE_ORDER[common_tp_nm] 활동유형

# @metric은 SQL 파라미터가 아니다 — 원본에서도 선언만 있고 본문 참조가 없다.
# 컬럼 선택은 SQL을 바꾸지 않고 응답 projection 단계에서만 적용한다.
column_selection:
  applies_at: projection
  sql_parameter: false

# ── 출력 컬럼 ───────────────────────────────────────────────────────────────
# SC 열은 ScName이 NULL이 아닐 때만 존재한다(분기 B).
# 브라우저 객체 필터로 내보낼 축. GOLD의 DECLARE 슬라이서 블록이 곧 BI 페이지의
# 슬라이서라, 기간(연·월·일)만 빼고 그대로 옮겼다. 결과에 그 컬럼이 실제로 있는
# 것만 넣는다 — 없는 컬럼을 내걸면 걸 대상이 없다.
filterable_dimensions:
  - { id: dealer,            column: 딜러 }
  - { id: showroom,          column: 전시장 }
  - { id: department,        column: 팀 }
  - { id: sales_consultant,  column: SC }
  - { id: activity_type,     column: 활동유형 }

dimension_columns:
  branch_a: ['연도', '월', '딜러', '전시장', '팀', '활동유형']
  branch_b: ['연도', '월', '딜러', '전시장', '팀', 'SC', '활동유형']

total_row:
  detect_by: { column: '딜러', equals: '합계' }
  note: 합계 행은 SQL이 이미 올바른 규칙으로 계산했다. 애플리케이션에서 다시 집계하지 말 것.

# ── 컬럼 의미론 ─────────────────────────────────────────────────────────────
# 차트/집계 시 이 규칙을 반드시 따른다. 어기면 조용히 틀린 숫자가 나온다.
column_semantics:
  활동목표:   { type: additive, grain: row }
  활동실적:   { type: additive, grain: row }
  기회목표:   { type: additive, grain: row }
  기회실적:   { type: additive, grain: row }
  계약실적:   { type: additive, grain: row }

  # 상위 grain 값이 상세 행에 반복 표시된다. 그대로 SUM하면 중복 합산된다.
  # (예: 한 팀의 계약목표 100이 활동유형 3행에 반복 → 단순 SUM은 300)
  계약목표:
    type: repeated_higher_grain_value
    grain_branch_a: ['연도', '월', '딜러', '전시장', '팀']
    grain_branch_b: ['연도', '월', '딜러', '전시장', '팀', 'SC']
    direct_sum_forbidden: true
    correct_aggregation: grain 단위로 중복 제거 후 합산(SQL 합계 행의 sc_first=1과 동일)

  # 비율은 평균 내면 안 되고 분자/분모를 다시 합산해 재계산해야 한다.
  # 분모 0일 때 GOLD가 내는 값 — 진척률은 1.0/0.0, 전환율은 NULL로 서로 다르다.
  활동진척률: { type: ratio, numerator: 활동실적, denominator: 활동목표, direct_average_forbidden: true, recompute_ratio: true, zero_denominator_result: 1.0, ratio_basis: target }
  기회전환률: { type: ratio, numerator: 기회실적, denominator: 활동실적, direct_average_forbidden: true, recompute_ratio: true, ratio_basis: stage }
  기회진척률: { type: ratio, numerator: 기회실적, denominator: 기회목표, direct_average_forbidden: true, recompute_ratio: true, zero_denominator_result: 0.0, ratio_basis: target }
  계약전환률: { type: ratio, numerator: 계약실적, denominator: 기회실적, direct_average_forbidden: true, recompute_ratio: true, ratio_basis: stage }
  # 이름은 "진행률"이지만 계산은 계약실적 ÷ 계약목표 — 목표 대비 성과(진척)다.
  # 같은 리포트의 활동진척률·기회진척률과 같은 종류인데 GOLD가 다르게 이름 붙였다.
  계약진행률:
    type: higher_grain_ratio
    ratio_basis: target
    denominator: 계약목표
    direct_average_forbidden: true
    recompute_ratio: true
    # 분자(GOLD의 cntrct_act_sc = 팀/SC 단위 계약실적 소계)는 별도 출력 컬럼이 없다.
    # 다만 상세 행에서 계약진행률 = cntrct_act_sc / cntrct_tgt_sc 이므로
    # 분자 = 계약진행률 × 계약목표 로 복원할 수 있다. 롤업은 이 방식을 쓴다.
    numerator_recoverable_as: [계약진행률, '×', 계약목표]
    note: 분자·분모 모두 계약목표와 같은 상위 grain(팀 또는 SC)이라 중복 제거 후 재계산해야 한다.

format:
  percentage: ['활동진척률', '기회전환률', '기회진척률', '계약전환률', '계약진행률']
  integer: ['활동목표', '활동실적', '기회목표', '기회실적', '계약목표', '계약실적']

# ── 권한 ────────────────────────────────────────────────────────────────────
# 주의: 현재 이 서버에는 인증/세션이 없다. authorization_scope는 호출자가 넘기는
# 값일 뿐이며 신뢰할 수 있는 신원에서 파생되지 않는다. 즉 지금 이것은 보안 경계가
# 아니라 구조상의 자리(seam)다. 서버 인증이 도입되기 전까지 이 필드에 의존해
# "권한이 강제된다"고 말해서는 안 된다.
authorization:
  enforced: false
  reason: 서버측 인증/세션 미구현 — src/auth/UserContext.jsx의 클라이언트 상태가 유일한 출처
  intersect_dimensions: ['DealerNm', 'ScName']
