# Certified Report 목록.
# 여기 등록된 리포트만 실행할 수 있다. LLM은 report_id를 고를 수만 있고
# SQL을 쓰거나 고칠 수 없다.
#
# 2026-08-04 leo: source_dependency_sets는 캐시 최신성 판정용 선언이다. 실행 SQL을 파싱하지 않고 이
# 허용 목록의 MAX(ETL_TIMESTAMP)만 1시간마다 확인한다. 각 리포트는 아래 집합 하나를
# 명시적으로 선택하며, 새 리포트는 반드시 적절한 source_dependency_set을 추가해야 한다.
source_dependency_sets:
  funnel_core:
    - {source_id: activity, table: FCT_ACTIVITY_v2}
    - {source_id: activity_target_daily, table: FCT_CRM_TARGET_D}
    - {source_id: lead, table: FCT_LEAD}
    - {source_id: monthly_target, table: FCT_CRM_TARGET_M}
    - {source_id: contract, table: FCT_CONTRACT_KTWS}
    - {source_id: user_dimension, table: DIM_MNG_USER}
    - {source_id: dealer_dimension, table: DIM_MNG_DEALER}
    - {source_id: activity_type_dimension, table: DIM_CRM_ACT_TYPE}
    - {source_id: activity_type_order_dimension, table: DIM_CRM_ACT_TYPE_ORDER}
  activity_progress:
    - {source_id: activity, table: FCT_ACTIVITY_v2}
    - {source_id: activity_target_daily, table: FCT_CRM_TARGET_D}
    - {source_id: user_dimension, table: DIM_MNG_USER}
    - {source_id: dealer_dimension, table: DIM_MNG_DEALER}
    - {source_id: calendar_dimension, table: DIM_CALENDAR_KTWS}
  target_management:
    - {source_id: monthly_target, table: FCT_CRM_TARGET_M}
    - {source_id: daily_target, table: FCT_CRM_TARGET_D}
    - {source_id: target_status, table: FCT_CRM_TARGET_STS}
    - {source_id: user_dimension, table: DIM_MNG_USER}
    - {source_id: dealer_dimension, table: DIM_MNG_DEALER}
  delivery:
    - {source_id: contract, table: FCT_CONTRACT_KTWS}
    - {source_id: sales_target_daily, table: FCT_SALES_TARGET_DAILY}
    - {source_id: monthly_target, table: FCT_CRM_TARGET_M}
    - {source_id: user_dimension, table: DIM_MNG_USER}
    - {source_id: dealer_dimension, table: DIM_MNG_DEALER}
    - {source_id: calendar_dimension, table: DIM_CALENDAR_KTWS}
  lead_detail:
    - {source_id: lead, table: FCT_LEAD}
    - {source_id: activity, table: FCT_ACTIVITY_v2}
    - {source_id: contract, table: FCT_CONTRACT_KTWS}
    - {source_id: user_dimension, table: DIM_MNG_USER}
    - {source_id: dealer_dimension, table: DIM_MNG_DEALER}
  hotboard:
    - {source_id: hotboard_meeting, table: FCT_HBOARD_MEETING}
    - {source_id: lead, table: FCT_LEAD}
    - {source_id: user_dimension, table: DIM_MNG_USER}

reports:
  - report_id: activity_funnel_status
    contract: contracts/activity_funnel_status.yaml
    projection: projections/activity_funnel_status_charts.yaml
    source_dependency_set: funnel_core
    # 이 리포트를 골라야 하는 질문의 특징 — 라우팅 프롬프트에 그대로 쓰인다.
    routing_hints:
      - 활동 퍼널 현황 표 전체
      - 퍼널 11개 지표를 한 번에
      - 활동/기회/계약 목표·실적·진척률을 같이
      - 합계 행이나 딜러·전시장·팀 전체 계층이 필요할 때
      - Power BI [활동 퍼널 현황] 화면과 같은 표

  - report_id: funnel_full_structure
    contract: contracts/funnel_full_structure.yaml
    source_dependency_set: funnel_core
    routing_hints:
      - 시승을 포함한 퍼널 전체 지표
      - 시승 건수·시승 목표·시승 진행률·시승에서 계약 전환율
      - 활동/기회/시승/계약을 한 번에
      - 특정 일자 기준(N일까지) 퍼널 현황
      - 브랜드·활동유형분류까지 나눠 보고 싶을 때

  - report_id: target_management_funnel_avg
    contract: contracts/target_management_funnel_avg.yaml
    source_dependency_set: funnel_core
    routing_hints:
      - 과거 3개월(또는 N개월) 퍼널 실적 평균
      - 월 목표를 세우기 위한 과거 실적 기준선
      - 딜러/전시장/부서별 활동·영업기회·계약 평균
      - 지난 몇 달 평균이 어느 정도였는지

  - report_id: target_management_month
    contract: contracts/target_management_month.yaml
    source_dependency_set: target_management
    routing_hints:
      - 이번 달 목표가 얼마로 잡혀 있는지
      - 판매목표대수·활동기준대수·계약목표·영업기회목표·활동배수
      - 목표 입력 여부 확인
      - 딜러/전시장/부서별 월 목표 설정 현황

  - report_id: daily_activity_progress
    contract: contracts/daily_activity_progress.yaml
    source_dependency_set: activity_progress
    routing_hints:
      - 특정 날짜(일) 기준 활동 진행 현황
      - 일별 활동 실적·잔여 타겟
      - 오늘 활동이 얼마나 남았는지
      - 일 단위로 나눠 봐야 하는 활동 질문

  - report_id: sc_delivery_status
    contract: contracts/sc_delivery_status.yaml
    source_dependency_set: delivery
    routing_hints:
      - SC별 출고 현황·월평균 출고대수
      - 누적취소율 / 취소율이 높은 SC
      - PMA IN / PMA OUT — 건수든 비중이든 이 리포트에만 있다.
        "딜러별 연누적 출고"처럼 다른 리포트 제목과 닮은 말이 붙어 있어도 PMA를 물으면 여기다.
      - SC 등급(A/B/C) 분포
      - 모델·차종·연식·SFX별 출고

  - report_id: delivery_by_model
    contract: contracts/delivery_by_model.yaml
    source_dependency_set: delivery
    routing_hints: [모델별 출고 대수, 어떤 모델이 많이 나갔는지, 차종·연식·SFX별 연누적 출고]

  - report_id: delivery_by_grade
    contract: contracts/delivery_by_grade.yaml
    source_dependency_set: delivery
    routing_hints: [등급(GRADE)별 출고, SFX별 출고 연누적]

  - report_id: delivery_by_payment
    contract: contracts/delivery_by_payment.yaml
    source_dependency_set: delivery
    routing_hints: [자사금융 여부별 출고, 지불유형별 출고, 금융 상품 침투율]

  - report_id: delivery_history
    contract: contracts/delivery_history.yaml
    source_dependency_set: delivery
    routing_hints: [출고 이력 목록, 계약번호·고객명·계약일자·출고일자, 리드타임(계약에서 출고까지 며칠)]

  - report_id: lead_list
    contract: contracts/lead_list.yaml
    source_dependency_set: lead_detail
    routing_hints: [영업기회 목록, 리드 명세·등록일·관심도, 계약/미계약 리드 목록, 특정 SC의 리드 리스트]

  - report_id: customer_chip_funnel
    contract: contracts/customer_chip_funnel.yaml
    source_dependency_set: lead_detail
    routing_hints: [고객 관리 칩, 상담·시승·계약·출고 단계별 고객, 고객별 퍼널 진행 단계]

  - report_id: hotboard_meeting
    contract: contracts/hotboard_meeting.yaml
    source_dependency_set: hotboard
    routing_hints: [핫보드 회의, HOT 리드 회의록, 금주 계약 가능성, 경쟁차종·보유차종]

  - report_id: target_saved_status
    contract: contracts/target_saved_status.yaml
    source_dependency_set: target_management
    routing_hints: [목표 저장 현황, 목표를 입력하지 않은 조직, 당월 목표 입력 여부]

  - report_id: sc_funnel_by_activity_type
    contract: contracts/sc_funnel_by_activity_type.yaml
    source_dependency_set: funnel_core
    routing_hints: [활동유형별 퍼널, 유형별로 어디서 막히는지, 조직 구분 없이 유형별 전환율]

  - report_id: weekly_activity_progress
    contract: contracts/weekly_activity_progress.yaml
    source_dependency_set: activity_progress
    routing_hints: [주차별 활동 진행, 이번 달 몇 주차에 얼마나 했는지, 주 단위 활동 목표·달성률]

  - report_id: sales_achievement_contract
    contract: contracts/sales_achievement_contract.yaml
    source_dependency_set: delivery
    routing_hints: [계약 실적·타겟·달성률, 계약 취소 건수, 월별 판매 성취도 계약]

  - report_id: sales_achievement_delivery
    contract: contracts/sales_achievement_delivery.yaml
    source_dependency_set: delivery
    routing_hints: [출고 목표·실적·달성률, 월별 판매 성취도 출고]

  - report_id: contract_list_detail
    contract: contracts/contract_list_detail.yaml
    source_dependency_set: delivery
    routing_hints: [계약 목록 명세, 계약번호·고객명·계약일자, 계약 건별 리스트]

  - report_id: delivery_list_detail
    contract: contracts/delivery_list_detail.yaml
    source_dependency_set: delivery
    routing_hints: [출고 목록 명세, 출고 건별 리스트, 계약에서 출고까지 리드타임]

  - report_id: sc_card_monthly
    contract: contracts/sc_card_monthly.yaml
    source_dependency_set: delivery
    routing_hints:
      - 고객수·HOT영업기회·전체영업기회·NPS
      - 기회창출 영업기회 3개월 평균
      - SC 근속년수·나이·프로필(이름·팀·나이)
      - 팀별 SC 인원수
      - SC 카드 요약(계약·출고 진행률과 고객/영업기회/NPS를 한 번에)
      - BI "2-2. 활동 트렌드"와 "2-3. 출고 현황" 왼쪽 카드 패널의 값 — 두 화면이 같은 카드다
      - 판매 진행률 게이지 — 계약 목표 대비 계약 건수, 출고 목표 대비 출고 건수.
        BI 2-3 화면의 게이지가 이 값이다(2026-04 렉서스 부산 영업6팀 = 계약 12/17 71%).
        퍼널의 계약건수(당월활동실적)와는 다른 수다 — 그쪽은 활동에서 이어진 건만 센다(5).
        목표 대비 계약/출고를 게이지로 묻는 질문은 반드시 이 리포트다.

  - report_id: delivery_status_monthly
    contract: contracts/delivery_status_monthly.yaml
    source_dependency_set: delivery
    routing_hints:
      - 월누적 출고 / 월별 출고 MTD·YTD·전월 비교
      - DMS 사용 유형별 출고 — 관계형성·기회창출·소개로 나눈 출고 건수
      - 월누적 관계형성, 연누적 소개처럼 유형과 기간을 함께 묻는 출고 질문
